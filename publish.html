<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發佈內容 — INTRVL Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="alternate icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

#gate { display: none; }
body.ready #gate { display: block; }
body.checking::after {
  content: ""; position: fixed; inset: 0; z-index: 1; background: var(--bg);
}
body.checking::before {
  content: ""; position: fixed; z-index: 2; left: 50%; top: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 3px solid var(--rule-soft); border-top-color: var(--mauve);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.nav {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 16px 28px;
  background: rgba(251,246,238,0.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule-soft);
}
.nav .logo { height: 24px; }
.btn-out {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--ink-soft);
  background: #fff; border: 1px solid var(--rule); border-radius: 10px;
  transition: background .15s;
}
.btn-out:hover { background: var(--bg-alt); }

.wrap { max-width: 680px; margin: 0 auto; padding: 56px 28px 90px; }
.eyebrow {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 8px;
}
h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
.lede { color: var(--ink-soft); margin-bottom: 32px; }

/* 類型選擇 */
.chooser { display: flex; gap: 12px; margin-bottom: 26px; }
.choice {
  flex: 1; padding: 18px; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 700; color: var(--ink-soft);
  background: #fff; border: 1px solid var(--rule); border-radius: 14px;
  transition: border-color .15s, color .15s, background .15s;
}
.choice:hover { border-color: var(--mauve); }
.choice.active { color: #fff; background: var(--gradient); border-color: transparent; }

/* 表單 */
.editor { padding: 24px; background: #fff; border: 1px solid var(--rule); border-radius: 16px; }
.editor[hidden] { display: none; }
.editor label {
  display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  color: var(--ink-mute); margin: 6px 2px 6px;
}
.editor input, .editor textarea, .editor select {
  width: 100%; padding: 12px 14px; font-family: inherit; font-size: 15px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--rule);
  border-radius: 10px; outline: none; margin-bottom: 14px; resize: vertical;
}
.editor input:focus, .editor textarea:focus, .editor select:focus {
  border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(181,129,163,0.15);
}
.editor textarea { min-height: 130px; }
.editor select { cursor: pointer; }
.editor .buttons { display: flex; gap: 10px; margin-top: 6px; }
.editor button {
  padding: 12px 24px; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 700; color: #fff;
  background: var(--gradient); border: none; border-radius: 10px;
}
.editor button:disabled { opacity: .6; cursor: not-allowed; }
.editor .btn-cancel {
  background: #fff; color: var(--ink-soft); border: 1px solid var(--rule);
}
.editor .btn-cancel:hover { background: var(--bg-alt); }
</style>
</head>
<body class="checking">

<div id="gate">
  <nav class="nav">
    <a href="members.html"><img class="logo" src="assets/logo_en.svg" alt="INTRVL Studio"></a>
    <a class="btn-out" href="members.html">← 成員專區</a>
  </nav>

  <main class="wrap">
    <p class="eyebrow">管理員</p>
    <h1 id="pageTitle">發佈內容</h1>
    <p class="lede" id="pageLede">選擇你想發佈的類型。</p>

    <!-- 類型選擇（編輯模式會隱藏） -->
    <div class="chooser" id="chooser">
      <button type="button" class="choice" data-type="link">快速連結</button>
      <button type="button" class="choice" data-type="ann">公告</button>
    </div>

    <!-- 快速連結表單 -->
    <form class="editor" id="linkForm" hidden>
      <label>標題</label>
      <input id="linkTitle" maxlength="100" required>
      <label>說明</label>
      <input id="linkDesc" maxlength="300">
      <label>分類</label>
      <select id="linkCategory" aria-label="分類"></select>
      <label>連結網址</label>
      <input id="linkUrl" type="url" maxlength="2000" placeholder="https://..." required>
      <div class="buttons">
        <button type="submit" id="linkSubmit">新增連結</button>
        <button type="button" class="btn-cancel" id="linkCancel">取消</button>
      </div>
    </form>

    <!-- 公告表單 -->
    <form class="editor" id="annForm" hidden>
      <label>標題</label>
      <input id="annTitle" maxlength="150" required>
      <label>內容</label>
      <textarea id="annBody" maxlength="5000" required></textarea>
      <div class="buttons">
        <button type="submit" id="annSubmit">張貼公告</button>
        <button type="button" class="btn-cancel" id="annCancel">取消</button>
      </div>
    </form>
  </main>
</div>

<script type="module">
import {
  auth, onAuthStateChanged, isAdmin, CATS,
  db, collection, doc, getDoc, addDoc, updateDoc, serverTimestamp
} from "./assets/auth.js";

/* 解析網址參數：?type=link|ann&id=xxx → 編輯模式 */
const params = new URLSearchParams(location.search);
const editType = params.get('type') === 'ann' ? 'ann'
               : params.get('type') === 'link' ? 'link' : null;
const editId = params.get('id');
const isEditing = !!(editType && editId);

const chooser   = document.getElementById('chooser');
const linkForm  = document.getElementById('linkForm');
const annForm   = document.getElementById('annForm');
const linkCategory = document.getElementById('linkCategory');

/* 顯示指定類型的表單 */
function showForm(type) {
  linkForm.hidden = (type !== 'link');
  annForm.hidden  = (type !== 'ann');
  chooser.querySelectorAll('.choice').forEach(b =>
    b.classList.toggle('active', b.dataset.type === type));
}

/* 填入分類下拉（中文） */
function populateCategory() {
  linkCategory.innerHTML = CATS.map(c =>
    `<option value="${c.id}">${c.label['zh-TW']}</option>`).join('');
}

/* 類型選擇（僅新增模式可切換） */
chooser.querySelectorAll('.choice').forEach(b =>
  b.addEventListener('click', () => showForm(b.dataset.type)));

/* 取消 → 回成員專區 */
document.getElementById('linkCancel').addEventListener('click', () => location.href = 'members.html');
document.getElementById('annCancel').addEventListener('click', () => location.href = 'members.html');

/* 送出：連結 */
linkForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('linkSubmit'); b.disabled = true;
  const data = {
    title: document.getElementById('linkTitle').value.trim(),
    desc:  document.getElementById('linkDesc').value.trim(),
    url:   document.getElementById('linkUrl').value.trim(),
    category: linkCategory.value
  };
  try {
    if (isEditing) await updateDoc(doc(db, 'links', editId), data);
    else await addDoc(collection(db, 'links'), { ...data, createdAt: serverTimestamp() });
    location.href = 'members.html';
  } catch (err) { alert(err.message); b.disabled = false; }
});

/* 送出：公告 */
annForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('annSubmit'); b.disabled = true;
  const data = {
    title: document.getElementById('annTitle').value.trim(),
    body:  document.getElementById('annBody').value.trim()
  };
  try {
    if (isEditing) await updateDoc(doc(db, 'announcements', editId), data);
    else await addDoc(collection(db, 'announcements'), { ...data, createdAt: serverTimestamp() });
    location.href = 'members.html';
  } catch (err) { alert(err.message); b.disabled = false; }
});

/* 載入既有資料（編輯模式） */
async function loadForEdit() {
  const col = editType === 'link' ? 'links' : 'announcements';
  const snap = await getDoc(doc(db, col, editId));
  if (!snap.exists()) { alert('找不到資料'); location.href = 'members.html'; return; }
  const v = snap.data();
  if (editType === 'link') {
    document.getElementById('linkTitle').value = v.title || '';
    document.getElementById('linkDesc').value  = v.desc || '';
    document.getElementById('linkUrl').value   = v.url || '';
    linkCategory.value = v.category || CATS[0].id;
    document.getElementById('linkSubmit').textContent = '儲存變更';
  } else {
    document.getElementById('annTitle').value = v.title || '';
    document.getElementById('annBody').value  = v.body || '';
    document.getElementById('annSubmit').textContent = '儲存變更';
  }
}

/* ---------- 驗證守門（僅管理員可進入） ---------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.replace('login.html'); return; }
  const ok = await isAdmin(user.uid);
  if (!ok) { location.replace('members.html'); return; }

  populateCategory();

  if (isEditing) {
    chooser.style.display = 'none';
    document.getElementById('pageTitle').textContent = '編輯內容';
    document.getElementById('pageLede').textContent = '修改後按儲存即可更新。';
    await loadForEdit();
    showForm(editType);
  } else {
    showForm('link');   // 預設選快速連結，可切換到公告
  }

  document.body.classList.remove('checking');
  document.body.classList.add('ready');
});
</script>
</body>
</html>
