<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>員工資料 — INTRVL Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="alternate icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

#gate { display: none; }
body.ready #gate { display: block; }
body.checking::after {
  content: ""; position: fixed; inset: 0; z-index: 1; background: var(--bg);
}
body.checking::before {
  content: ""; position: fixed; z-index: 2; left: 50%; top: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 3px solid var(--rule-soft); border-top-color: var(--mauve);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 頂部列 ---------- */
.nav {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 16px 28px;
  background: rgba(251,246,238,0.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule-soft);
}
.nav .logo { height: 24px; }
.btn-out {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--ink-soft);
  background: #fff; border: 1px solid var(--rule); border-radius: 10px;
  transition: background .15s;
}
.btn-out:hover { background: var(--bg-alt); }

.wrap { max-width: 940px; margin: 0 auto; padding: 48px 28px 90px; }
.eyebrow {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--mauve); font-weight: 700; margin-bottom: 8px;
}
h1 { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
.lede { color: var(--ink-soft); margin-bottom: 28px; }

.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 700; color: #fff;
  background: var(--gradient); border: none; border-radius: 11px;
  transition: filter .15s;
}
.btn-primary:hover { filter: brightness(1.04); }
.btn-primary svg { width: 16px; height: 16px; }

/* ---------- 列表 ---------- */
.table-card { margin-top: 22px; background: #fff; border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.staff-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.staff-table th {
  text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-mute);
  padding: 14px 16px; border-bottom: 1px solid var(--rule-soft); white-space: nowrap;
}
.staff-table td { padding: 13px 16px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
.staff-table tr:last-child td { border-bottom: none; }
.staff-table tbody tr { transition: background .12s; }
.staff-table tbody tr:hover { background: var(--bg); }
.cell-name { display: flex; align-items: center; gap: 10px; }
.mini-av {
  width: 32px; height: 32px; flex: none; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 800;
  font-size: 13px; background: var(--gradient); text-transform: uppercase; overflow: hidden;
}
.mini-av img { width: 100%; height: 100%; object-fit: cover; }
.col-no { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
.muted { color: var(--ink-mute); }

.status-badge {
  display: inline-block; font-size: 12px; font-weight: 700;
  padding: 3px 11px; border-radius: 999px; white-space: nowrap;
}
.status-active   { color: #2F7D5B; background: #E4F2E9; border: 1px solid #BFE0CD; }
.status-left     { color: #8E7C6E; background: var(--bg-alt); border: 1px solid var(--rule-soft); }
.status-contract { color: #B5762E; background: #FBEBD9; border: 1px solid #F0D6B4; }

.btn-edit {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--ink-soft);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 9px;
  transition: color .15s, border-color .15s, background .15s;
}
.btn-edit:hover { color: var(--mauve); border-color: var(--mauve); background: #fff; }
.btn-edit svg { width: 14px; height: 14px; }

.empty { padding: 40px; text-align: center; color: var(--ink-mute); font-size: 14px; }

/* ---------- 編輯表單 ---------- */
.editor-view[hidden], .list-view[hidden] { display: none; }
.form-card { margin-top: 22px; padding: 26px; background: #fff; border: 1px solid var(--rule); border-radius: 18px; }

.avatar-block { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--rule-soft); }
.avatar-preview {
  width: 84px; height: 84px; flex: none; border-radius: 18px; overflow: hidden;
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 30px;
  background: var(--gradient); text-transform: uppercase;
}
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-act { display: flex; flex-direction: column; gap: 6px; }
.avatar-hint { font-size: 12px; color: var(--ink-mute); }
.file-btn {
  display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
  padding: 8px 14px; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--ink-soft);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
}
.file-btn:hover { background: var(--bg-alt); }
.file-clear { font-size: 12px; color: var(--ink-mute); background: none; border: none; cursor: pointer; text-decoration: underline; align-self: flex-start; padding: 2px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.field { margin-bottom: 16px; }
.field.full { grid-column: 1 / -1; }
.field label {
  display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  color: var(--ink-mute); margin: 0 2px 6px;
}
.field input, .field textarea, .field select {
  width: 100%; padding: 11px 13px; font-family: inherit; font-size: 14.5px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--rule);
  border-radius: 10px; outline: none; resize: vertical;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(181,129,163,0.15);
}
.field input:read-only { background: var(--bg-alt); color: var(--ink-mute); cursor: not-allowed; }
.field textarea { min-height: 92px; }
.field select { cursor: pointer; }
.field .sub { font-size: 11px; color: var(--ink-mute); margin: 5px 2px 0; }

.pw-wrap { position: relative; }
.pw-toggle {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--ink-mute);
  padding: 6px; display: grid; place-items: center;
}
.pw-toggle svg { width: 18px; height: 18px; }

.inwork-row { display: flex; align-items: center; gap: 8px; margin: 0 2px 8px; }
.inwork-row input { width: auto; }
.inwork-row label { margin: 0; font-size: 13px; color: var(--ink-soft); font-weight: 600; letter-spacing: 0; }

.lock-note {
  display: flex; gap: 9px; align-items: flex-start;
  margin: 4px 0 22px; padding: 12px 14px; font-size: 12.5px; color: var(--ink-soft);
  background: var(--bg-alt); border: 1px solid var(--rule-soft); border-radius: 11px;
}
.lock-note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--mauve); }

.form-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.form-foot .spacer { flex: 1; }
.editor button.save {
  padding: 12px 26px; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 700; color: #fff;
  background: var(--gradient); border: none; border-radius: 11px;
}
.editor button.save:disabled { opacity: .6; cursor: not-allowed; }
.btn-cancel {
  padding: 12px 22px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
  background: #fff; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 11px;
}
.btn-cancel:hover { background: var(--bg-alt); }
.btn-delete {
  padding: 10px 16px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
  color: #B23B36; background: #fff; border: 1px solid #E7B8B5; border-radius: 10px;
}
.btn-delete:hover { background: #FBEEED; }

.toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width: 680px) {
  .grid2 { grid-template-columns: 1fr; }
  .staff-table .hide-sm { display: none; }
  .wrap { padding: 32px 18px 80px; }
}
</style>
</head>
<body class="checking">

<div id="gate">
  <nav class="nav">
    <a href="members.html"><img class="logo" src="assets/logo_en.svg" alt="INTRVL Studio"></a>
    <a class="btn-out" href="members.html">← 成員專區</a>
  </nav>

  <main class="wrap">
    <!-- ============ 列表檢視 ============ -->
    <div class="list-view" id="listView">
      <p class="eyebrow">Admin Only</p>
      <div class="head-row">
        <div>
          <h1>員工資料</h1>
          <p class="lede" id="listLede">管理工作室成員的完整檔案。</p>
        </div>
        <button class="btn-primary" id="addBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增員工
        </button>
      </div>

      <div class="table-card">
        <table class="staff-table">
          <thead>
            <tr>
              <th>員工編號</th>
              <th>姓名</th>
              <th class="hide-sm">代稱</th>
              <th class="hide-sm">電子郵件</th>
              <th>僱員狀態</th>
              <th style="text-align:right">編輯</th>
            </tr>
          </thead>
          <tbody id="staffBody">
            <tr><td colspan="6" class="empty">載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ============ 編輯檢視 ============ -->
    <div class="editor-view" id="editorView" hidden>
      <p class="eyebrow">Admin Only</p>
      <h1 id="editTitle">編輯員工資料</h1>
      <p class="lede" id="editLede">所有欄位僅管理員可編輯。</p>

      <form class="editor form-card" id="staffForm">
        <!-- 大頭照 -->
        <div class="avatar-block">
          <div class="avatar-preview" id="avPreview">·</div>
          <div class="avatar-act">
            <label class="file-btn" for="avFile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
              上傳大頭照
            </label>
            <input type="file" id="avFile" accept="image/*" hidden>
            <button type="button" class="file-clear" id="avClear" hidden>移除照片</button>
            <span class="avatar-hint">自動裁切成正方形，存檔上限約 5MB</span>
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <label>員工編號</label>
            <input id="f_empNo" maxlength="20" placeholder="例：001">
          </div>
          <div class="field">
            <label>僱員狀態</label>
            <select id="f_status">
              <option value="active">在職</option>
              <option value="left">離職</option>
              <option value="contract">短期合作</option>
            </select>
          </div>

          <div class="field">
            <label>姓名（與資料卡同步）</label>
            <input id="f_name" maxlength="60" placeholder="本名">
          </div>
          <div class="field">
            <label>代稱（與資料卡同步）</label>
            <input id="f_alias" maxlength="60" placeholder="暱稱／英文名">
          </div>

          <div class="field full">
            <label>電子郵件（登入帳號，建立後不可變更）</label>
            <input id="f_email" type="email" maxlength="120" placeholder="name@gmail.com">
            <p class="sub" id="emailSub"></p>
          </div>

          <div class="field">
            <label>職稱</label>
            <input id="f_jobTitle" maxlength="60" placeholder="例：美術助手">
          </div>
          <div class="field">
            <label>登入後台密碼（僅管理員可見）</label>
            <div class="pw-wrap">
              <input id="f_loginPassword" type="password" maxlength="120" autocomplete="off">
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="顯示密碼">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label>行動電話</label>
            <input id="f_mobile" maxlength="30" placeholder="09xx-xxx-xxx">
          </div>
          <div class="field">
            <label>LINE ID</label>
            <input id="f_lineId" maxlength="60">
          </div>

          <div class="field full">
            <label>聯絡地址</label>
            <input id="f_address" maxlength="200">
          </div>

          <div class="field">
            <label>出生日期</label>
            <input id="f_birthday" type="date">
          </div>

          <div class="field">
            <label>身分證字號</label>
            <input id="f_nationalId" maxlength="20">
          </div>
          <div class="field">
            <label>護照號碼</label>
            <input id="f_passport" maxlength="30">
          </div>

          <div class="field">
            <label>入職日期</label>
            <input id="f_hireDate" type="date">
          </div>
          <div class="field">
            <label>離職日期</label>
            <div class="inwork-row">
              <input type="checkbox" id="f_inWork">
              <label for="f_inWork">仍在職（無離職日）</label>
            </div>
            <input id="f_leaveDate" type="date">
          </div>

          <div class="field full">
            <label>備註</label>
            <textarea id="f_note" maxlength="3000" placeholder="僅管理員可見"></textarea>
          </div>
        </div>

        <div class="lock-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>員工本人登入只會同步看到「姓名／代稱／大頭照」；身分證、護照、備註、登入密碼等欄位只有管理員看得到。修改「登入後台密碼」欄位僅更新此處的紀錄，員工實際登入密碼需另在 Firebase Console 變更。</span>
        </div>

        <div class="form-foot">
          <button type="button" class="btn-delete" id="deleteBtn" hidden>刪除此員工</button>
          <span class="spacer"></span>
          <button type="button" class="btn-cancel" id="cancelBtn">取消</button>
          <button type="submit" class="save" id="saveBtn">儲存</button>
        </div>
      </form>
    </div>

    <div class="note" id="loadError" style="display:none; margin-top:22px; padding:18px 20px; background:var(--bg-alt); border:1px solid var(--rule-soft); border-radius:14px; color:var(--ink-soft); font-size:14px;">
      無法載入員工資料。請確認已在 Firebase Console 發布最新的 firestore.rules。
    </div>
  </main>
</div>

<script type="module">
import {
  auth, onAuthStateChanged, isAdmin,
  db, collection, doc, getDoc, getDocs, setDoc, deleteDoc, serverTimestamp
} from "./assets/auth.js";

/* ---------- 預建員工種子（首次進入、集合為空時自動建立） ----------
   密碼為「紀錄」用途，僅管理員可見；不等於 Firebase Auth 實際登入密碼。 */
const SEED = [
  { email: 'sweetlove814@gmail.com',      empNo: '001', loginPassword: 'intrvlmem_001@', status: 'active', name: '', alias: '', jobTitle: '' },
  { email: 'page.art.official@gmail.com', empNo: '002', loginPassword: 'intrvlmem_002@', status: 'active', name: 'PAGE', alias: '', jobTitle: '' },
  { email: 'mega890302@gmail.com',        empNo: '003', loginPassword: 'intrvlmem_003@', status: 'active', name: 'MEGA', alias: '', jobTitle: '美術助手' },
  { email: 'zqartworkofficial@gmail.com', empNo: '000', loginPassword: 'admin_000@',     status: 'active', name: '', alias: '', jobTitle: '' }
];

/* 員工資料的所有欄位（與 firestore.rules 的 validStaff 白名單一致） */
const FIELDS = ['empNo','name','alias','email','status','address','mobile','lineId','jobTitle','loginPassword','birthday','passport','nationalId','note','hireDate','leaveDate','avatar'];

const STATUS_LABEL = { active: '在職', left: '離職', contract: '短期合作' };
const STATUS_CLASS = { active: 'status-active', left: 'status-left', contract: 'status-contract' };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const emailId = (e) => String(e ?? '').trim().toLowerCase();
const val = (id) => document.getElementById(id).value.trim();

/* ---------- 元素 ---------- */
const listView   = document.getElementById('listView');
const editorView = document.getElementById('editorView');
const staffBody  = document.getElementById('staffBody');
const loadError  = document.getElementById('loadError');
const form       = document.getElementById('staffForm');

let currentAvatar = '';   // 目前表單的大頭照 data URL
let editingId = null;     // 正在編輯的 email（小寫）；null = 新增

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 載入 + 渲染列表 ---------- */
async function loadList() {
  loadError.style.display = 'none';
  let snap;
  try {
    snap = await getDocs(collection(db, 'staff'));
  } catch (e) { loadError.style.display = 'block'; return; }

  // 集合為空 → 首次自動建立種子資料
  if (snap.empty) {
    try { await seedStaff(); snap = await getDocs(collection(db, 'staff')); toast('已建立初始員工資料'); }
    catch (e) { loadError.style.display = 'block'; return; }
  }

  const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => String(a.empNo || '').localeCompare(String(b.empNo || ''), 'zh-Hant', { numeric: true }));

  if (!rows.length) { staffBody.innerHTML = `<tr><td colspan="6" class="empty">尚無員工資料。</td></tr>`; return; }

  staffBody.innerHTML = '';
  rows.forEach(v => {
    const tr = document.createElement('tr');
    const initial = (String(v.name || v.alias || v.email || '·').trim()[0] || '·').toUpperCase();
    const av = v.avatar
      ? `<span class="mini-av"><img src="${esc(v.avatar)}" alt=""></span>`
      : `<span class="mini-av">${esc(initial)}</span>`;
    const st = v.status || 'active';
    tr.innerHTML =
      `<td class="col-no">${esc(v.empNo || '—')}</td>
       <td><div class="cell-name">${av}<span>${esc(v.name || '—')}</span></div></td>
       <td class="hide-sm">${v.alias ? esc(v.alias) : '<span class="muted">—</span>'}</td>
       <td class="hide-sm">${esc(v.email || v.id)}</td>
       <td><span class="status-badge ${STATUS_CLASS[st] || ''}">${esc(STATUS_LABEL[st] || st)}</span></td>
       <td style="text-align:right">
         <button type="button" class="btn-edit" data-id="${esc(v.id)}">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
           編輯
         </button>
       </td>`;
    staffBody.appendChild(tr);
  });
}

/* 首次建立種子（每筆只在不存在時建立） */
async function seedStaff() {
  for (const s of SEED) {
    const id = emailId(s.email);
    const ref = doc(db, 'staff', id);
    const existing = await getDoc(ref);
    if (existing.exists()) continue;
    const data = {};
    FIELDS.forEach(k => data[k] = (k === 'status' ? (s.status || 'active') : (s[k] ?? '')));
    data.email = id;
    data.updatedAt = serverTimestamp();
    await setDoc(ref, data);
    await setDoc(doc(db, 'profiles', id), {
      name: data.name, alias: data.alias, avatar: data.avatar, jobTitle: data.jobTitle, updatedAt: serverTimestamp()
    });
  }
}

/* ---------- 切換檢視 ---------- */
function showList() {
  editorView.hidden = true; listView.hidden = false;
  window.scrollTo({ top: 0 });
}
function showEditor() {
  listView.hidden = true; editorView.hidden = false;
  window.scrollTo({ top: 0 });
}

/* ---------- 大頭照預覽 ---------- */
function renderAvatar() {
  const p = document.getElementById('avPreview');
  const clearBtn = document.getElementById('avClear');
  if (currentAvatar) {
    p.innerHTML = `<img src="${esc(currentAvatar)}" alt="">`;
    clearBtn.hidden = false;
  } else {
    const initial = (val('f_name') || val('f_alias') || val('f_email') || '·').trim()[0] || '·';
    p.textContent = initial.toUpperCase();
    clearBtn.hidden = true;
  }
}

/* 讀檔 → 置中裁切成正方形 → 縮到 400px → JPEG data URL */
function processAvatar(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (!file.type.startsWith('image/')) return reject(new Error('請選擇圖片檔'));
    if (file.size > 5 * 1024 * 1024) return reject(new Error('原始圖片請小於 5MB'));
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2;
      const sy = (img.naturalHeight - side) / 2;
      const target = 400;
      const cv = document.createElement('canvas');
      cv.width = target; cv.height = target;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, target, target);
      ctx.drawImage(img, sx, sy, side, side, 0, 0, target, target);
      resolve(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}

document.getElementById('avFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    currentAvatar = await processAvatar(file);
    renderAvatar();
  } catch (err) { alert(err.message); }
  e.target.value = '';
});
document.getElementById('avClear').addEventListener('click', () => {
  currentAvatar = ''; renderAvatar();
});

/* 密碼顯示／隱藏 */
document.getElementById('pwToggle').addEventListener('click', () => {
  const i = document.getElementById('f_loginPassword');
  i.type = i.type === 'password' ? 'text' : 'password';
});

/* 「仍在職」勾選 → 停用離職日期 */
const inWork = document.getElementById('f_inWork');
const leaveDate = document.getElementById('f_leaveDate');
inWork.addEventListener('change', () => {
  leaveDate.disabled = inWork.checked;
  if (inWork.checked) leaveDate.value = '';
});

/* 姓名／代稱／email 變動時更新預覽字母 */
['f_name','f_alias','f_email'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => { if (!currentAvatar) renderAvatar(); }));

/* ---------- 開啟編輯（載入既有資料） ---------- */
function fillForm(v) {
  document.getElementById('f_empNo').value    = v.empNo || '';
  document.getElementById('f_status').value   = v.status || 'active';
  document.getElementById('f_name').value     = v.name || '';
  document.getElementById('f_alias').value    = v.alias || '';
  document.getElementById('f_email').value    = v.email || v.id || '';
  document.getElementById('f_jobTitle').value = v.jobTitle || '';
  document.getElementById('f_loginPassword').value = v.loginPassword || '';
  document.getElementById('f_mobile').value   = v.mobile || '';
  document.getElementById('f_lineId').value   = v.lineId || '';
  document.getElementById('f_address').value  = v.address || '';
  document.getElementById('f_birthday').value = v.birthday || '';
  document.getElementById('f_nationalId').value  = v.nationalId || '';
  document.getElementById('f_passport').value = v.passport || '';
  document.getElementById('f_hireDate').value = v.hireDate || '';
  document.getElementById('f_leaveDate').value = v.leaveDate || '';
  document.getElementById('f_note').value     = v.note || '';
  inWork.checked = !v.leaveDate;
  leaveDate.disabled = inWork.checked;
  currentAvatar = v.avatar || '';
}

function clearForm() {
  form.reset();
  FIELDS.forEach(k => { const el = document.getElementById('f_' + k); if (el) el.value = ''; });
  document.getElementById('f_status').value = 'active';
  inWork.checked = true; leaveDate.disabled = true;
  currentAvatar = '';
}

async function openEdit(id) {
  const emailEl = document.getElementById('f_email');
  const emailSub = document.getElementById('emailSub');
  const delBtn = document.getElementById('deleteBtn');
  if (id) {
    let snap;
    try { snap = await getDoc(doc(db, 'staff', id)); }
    catch (e) { alert('讀取失敗：' + e.message); return; }
    if (!snap.exists()) { alert('找不到資料'); return; }
    editingId = id;
    fillForm({ id, ...snap.data() });
    document.getElementById('editTitle').textContent = '編輯員工資料';
    emailEl.readOnly = true;
    emailSub.textContent = '電子郵件為登入帳號與資料鍵，無法在此變更。';
    delBtn.hidden = false;
  } else {
    editingId = null;
    clearForm();
    document.getElementById('editTitle').textContent = '新增員工';
    emailEl.readOnly = false;
    emailSub.textContent = '需與 Firebase Authentication 中的登入帳號一致，員工才能對應到自己的資料卡。';
    delBtn.hidden = true;
  }
  renderAvatar();
  showEditor();
}

/* ---------- 儲存 ---------- */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const saveBtn = document.getElementById('saveBtn');

  const email = emailId(val('f_email'));
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('請輸入有效的電子郵件'); return; }
  const id = editingId || email;

  const data = {
    empNo: val('f_empNo'),
    name: val('f_name'),
    alias: val('f_alias'),
    email: email,
    status: document.getElementById('f_status').value,
    address: val('f_address'),
    mobile: val('f_mobile'),
    lineId: val('f_lineId'),
    jobTitle: val('f_jobTitle'),
    loginPassword: document.getElementById('f_loginPassword').value,
    birthday: val('f_birthday'),
    passport: val('f_passport'),
    nationalId: val('f_nationalId'),
    note: val('f_note'),
    hireDate: val('f_hireDate'),
    leaveDate: inWork.checked ? '' : val('f_leaveDate'),
    avatar: currentAvatar || '',
    updatedAt: serverTimestamp()
  };

  saveBtn.disabled = true;
  try {
    // 新增時若 email 已存在，避免覆蓋既有員工
    if (!editingId) {
      const exists = await getDoc(doc(db, 'staff', id));
      if (exists.exists()) { alert('此電子郵件已有員工資料，請改用編輯。'); saveBtn.disabled = false; return; }
    }
    await setDoc(doc(db, 'staff', id), data);
    // 同步公開小卡（員工本人可讀：姓名／代稱／大頭照／職稱）
    await setDoc(doc(db, 'profiles', id), {
      name: data.name, alias: data.alias, avatar: data.avatar, jobTitle: data.jobTitle,
      updatedAt: serverTimestamp()
    });
    toast('已儲存');
    await loadList();
    showList();
  } catch (err) {
    alert('儲存失敗：' + err.message);
  } finally {
    saveBtn.disabled = false;
  }
});

/* ---------- 刪除 ---------- */
document.getElementById('deleteBtn').addEventListener('click', async () => {
  if (!editingId) return;
  if (!confirm('確定要刪除這位員工的資料嗎？此動作無法復原。')) return;
  try {
    await deleteDoc(doc(db, 'staff', editingId));
    try { await deleteDoc(doc(db, 'profiles', editingId)); } catch (e) {}
    toast('已刪除');
    await loadList();
    showList();
  } catch (err) { alert('刪除失敗：' + err.message); }
});

/* ---------- 列表互動 ---------- */
document.getElementById('addBtn').addEventListener('click', () => openEdit(null));
document.getElementById('cancelBtn').addEventListener('click', showList);
staffBody.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-edit');
  if (btn) openEdit(btn.dataset.id);
});

/* ---------- 驗證守門（僅管理員可進入） ---------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.replace('login.html'); return; }
  const ok = await isAdmin(user.uid);
  if (!ok) { location.replace('members.html'); return; }
  document.body.classList.remove('checking');
  document.body.classList.add('ready');
  loadList();
});
</script>
