<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>成員登入 — INTRVL Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="alternate icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body);
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.55;
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
}
img { display: block; max-width: 100%; }
a { color: inherit; }

.card {
  width: 100%; max-width: 400px;
  background: #fff; border: 1px solid var(--rule);
  border-radius: 22px; padding: 40px 34px;
  box-shadow: 0 24px 60px -28px rgba(31,24,20,0.22);
}
.logo { height: 30px; margin: 0 auto 22px; }
.eyebrow {
  text-align: center; font-size: 12px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-mute); margin-bottom: 6px;
}
h1 {
  text-align: center; font-size: 25px; font-weight: 700;
  margin-bottom: 26px; color: var(--ink);
}
label {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--ink-soft); margin-bottom: 7px;
}
input {
  width: 100%; padding: 13px 15px; margin-bottom: 18px;
  font-family: inherit; font-size: 15px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--rule);
  border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
input:focus { border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(181,129,163,0.15); }
button {
  width: 100%; padding: 14px; cursor: pointer;
  font-family: inherit; font-size: 15px; font-weight: 700; color: #fff;
  background: var(--gradient); border: none; border-radius: 12px;
  transition: filter .15s, transform .08s;
}
button:hover { filter: brightness(1.04); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .6; cursor: not-allowed; }
.msg {
  display: none; margin-top: 16px; padding: 11px 14px;
  font-size: 13.5px; border-radius: 10px; text-align: center;
}
.msg.error { display: block; background: #FBEAE9; color: #B23B36; border: 1px solid #F1C8C5; }
.msg.info  { display: block; background: var(--bg-alt); color: var(--ink-soft); border: 1px solid var(--rule-soft); }
.foot { margin-top: 24px; text-align: center; font-size: 13px; }
.foot a { color: var(--ink-mute); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<main class="card">
  <a href="index.html"><img class="logo" src="assets/logo_en.svg" alt="INTRVL Studio"></a>
  <p class="eyebrow">工作室成員</p>
  <h1>成員登入</h1>

  <form id="loginForm" autocomplete="on">
    <label for="email">電子郵件</label>
    <input id="email" type="email" autocomplete="email" required>

    <label for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button type="submit" id="submitBtn">登入</button>
  </form>

  <div class="msg" id="msg"></div>

  <p class="foot">
    <a href="index.html">← 回到首頁</a>
  </p>
</main>

<script type="module">
import { auth, signInWithEmailAndPassword, onAuthStateChanged }
  from "./assets/auth.js";

const form = document.getElementById('loginForm');
const btn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');

const MSG = {
  signingIn: '登入中…',
  badCred:   '電子郵件或密碼錯誤。',
  tooMany:   '嘗試次數過多，請稍後再試。',
  generic:   '登入失敗，請再試一次。'
};

function show(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

/* 已登入就直接進成員頁 */
onAuthStateChanged(auth, (user) => {
  if (user) window.location.replace('members.html');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  show(MSG.signingIn, 'info');

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.replace('members.html');
  } catch (err) {
    btn.disabled = false;
    let key = 'generic';
    if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email']
        .includes(err.code)) key = 'badCred';
    else if (err.code === 'auth/too-many-requests') key = 'tooMany';
    show(MSG[key], 'error');
  }
});
</script>
</body>
</html>
