<title>INTRVL 內部專區 — INTRVL Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="alternate icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
  --num: "Manrope", var(--body);
  --sidebar-w: 248px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* 驗證完成前先全部隱藏，避免內容閃現 */
#gate { display: none; }
body.ready #gate { display: block; }
body.checking::after {
  content: ""; position: fixed; inset: 0; z-index: 1; background: var(--bg);
}
body.checking::before {
  content: ""; position: fixed; z-index: 2; left: 50%; top: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 3px solid var(--rule-soft); border-top-color: var(--mauve);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ 整體版面：側邊欄 + 主內容 ============ */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

/* ---------- 側邊欄 ---------- */
.sidebar {
  position: sticky; top: 0; align-self: start; height: 100vh;
  display: flex; flex-direction: column;
  background: #fff; border-right: 1px solid var(--rule-soft);
  padding: 22px 16px;
}
.sidebar-logo { padding: 6px 10px 22px; }
.sidebar-logo img { height: 24px; }

.nav-scroll { flex: 1; overflow-y: auto; }
.nav-group { margin-bottom: 8px; }
.nav-group-title {
  padding: 14px 12px 8px; font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute);
}
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 12px; margin-bottom: 2px; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 500; text-align: left;
  color: var(--ink-soft); background: none; border: none; border-radius: 10px;
  transition: background .14s, color .14s;
}
.nav-item:hover { background: var(--bg-alt); color: var(--ink); }
.nav-item.active { background: var(--bg-alt); color: var(--mauve); font-weight: 700; }
.nav-item.active .nav-ico { color: var(--mauve); }
.nav-ico { width: 18px; height: 18px; flex: none; color: var(--ink-mute); }
.nav-ico svg { width: 100%; height: 100%; display: block; }
.nav-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-count {
  font-size: 12px; font-weight: 700; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: 999px; padding: 1px 8px; min-width: 24px; text-align: center;
}
.nav-item.active .nav-count { color: var(--mauve); border-color: var(--rule); }

/* ---------- 側邊欄底部：使用者卡片 ---------- */
.side-foot { margin-top: auto; padding-top: 16px; }
.user-card {
  display: flex; align-items: center; gap: 11px; padding: 11px;
  background: var(--bg); border: 1px solid var(--rule-soft); border-radius: 14px;
  margin-bottom: 10px;
}
.avatar {
  width: 38px; height: 38px; flex: none; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 800;
  font-size: 16px; background: var(--gradient); text-transform: uppercase;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-meta { min-width: 0; }
.user-email {
  font-size: 12.5px; font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.user-role { font-size: 11px; color: var(--ink-mute); }
body.is-admin .user-role { color: var(--mauve); font-weight: 700; }

/* ---------- 側邊欄底部：登出 ---------- */
.side-foot { padding-top: 16px; margin-top: 8px; border-top: 1px solid var(--rule-soft); }
.btn-out {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 10px 14px; cursor: pointer; font-family: inherit;
  font-size: 13.5px; font-weight: 600; border-radius: 11px;
  color: var(--ink-soft); background: #fff; border: 1px solid var(--rule);
  transition: background .15s;
}
.btn-out:hover { background: var(--bg-alt); }
.btn-out .ico { width: 16px; height: 16px; flex: none; }

/* 管理員專用元素（如「發佈」按鈕），非管理員隱藏 */
.admin-only { display: none; }
body.is-admin .admin-only { display: inline-flex; }

/* ---------- 主內容 ---------- */
.main { padding: 30px 40px 80px; max-width: 1180px; }

/* 視圖切換：預設隱藏，.active 才顯示 */
.view { display: none; }
.view.active { display: block; }

/* ============ 第一列：頁首（INTRVL內部專區 + 日期） ============ */
.topbar {
  position: relative; overflow: hidden;
  padding: 28px 34px; margin-bottom: 26px;
  background: var(--gradient); border-radius: 22px; color: #fff;
}
.topbar .eyebrow {
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,0.9); margin-bottom: 8px;
}
.topbar .bigdate {
  font-family: var(--num); font-size: 40px; font-weight: 800;
  letter-spacing: .01em; line-height: 1;
}
.topbar .weekday { font-size: 14px; color: rgba(255,255,255,0.92); margin-top: 10px; }
.topbar::before {
  content: ""; position: absolute; right: -40px; top: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
}

/* ============ 第二列：左右兩欄 ============ */
.dash-grid { display: grid; gap: 22px; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.dash-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

/* 卡片容器 */
.card {
  background: #fff; border: 1px solid var(--rule); border-radius: 18px;
  padding: 22px 24px;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px;
}
.card-title { font-size: 16px; font-weight: 700; color: var(--ink); }
.card-sub { font-size: 12.5px; color: var(--ink-mute); }
.card-link {
  font-size: 12.5px; font-weight: 700; color: var(--mauve);
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
}
.card-link svg { width: 13px; height: 13px; }

/* 員工資料卡 */
.profile { display: flex; align-items: flex-start; gap: 18px; }
.avatar {
  position: relative; width: 76px; height: 76px; flex: none; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 800;
  font-size: 30px; background: var(--gradient); text-transform: uppercase;
  overflow: hidden; box-shadow: inset 0 0 0 1px rgba(31,24,20,0.08);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-meta { min-width: 0; flex: 1; }
.profile-top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.profile-name {
  font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.2;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 帳號等級 tag（縮小） */
.role-pill {
  display: inline-block; padding: 1px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}
body.is-admin .role-pill { color: #fff; background: var(--gradient); border-color: transparent; }
.profile-alias { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
.profile-rows { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.profile-row { display: flex; gap: 10px; font-size: 12.5px; min-width: 0; }
.profile-row .pk { flex: none; width: 64px; color: var(--ink-mute); font-weight: 600; }
.profile-row .pv { color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 卡片右上角編輯按鈕 */
.card-edit {
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
  padding: 5px 11px; font-family: inherit; font-size: 12.5px; font-weight: 700;
  color: var(--ink-soft); background: #fff; border: 1px solid var(--rule);
  border-radius: 9px; transition: background .15s, color .15s, border-color .15s;
}
.card-edit:hover { color: var(--mauve); border-color: var(--mauve); background: var(--bg-alt); }
.card-edit svg { width: 13px; height: 13px; }

/* ============ 編輯彈窗 ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: 20px; background: rgba(31,24,20,0.42); backdrop-filter: blur(3px);
}
.modal-overlay[hidden] { display: none; }
.modal {
  width: 100%; max-width: 420px; max-height: calc(100vh - 40px); overflow-y: auto;
  background: #fff; border: 1px solid var(--rule); border-radius: 20px;
  box-shadow: 0 30px 70px -30px rgba(31,24,20,0.5);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 14px;
}
.modal-title { font-size: 17px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer;
  font-size: 20px; line-height: 1; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule-soft); border-radius: 9px;
}
.modal-close:hover { color: var(--ink); }
.modal-body { padding: 6px 24px 8px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px 22px; }
.btn-ghost, .btn-solid {
  padding: 10px 18px; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 700; border-radius: 11px; transition: filter .15s, background .15s;
}
.btn-ghost { color: var(--ink-soft); background: #fff; border: 1px solid var(--rule); }
.btn-ghost:hover { background: var(--bg-alt); }
.btn-solid { color: #fff; background: var(--gradient); border: none; }
.btn-solid:hover { filter: brightness(1.04); }

/* 圓形裁切器 */
.crop-section { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 4px; }
.cropper {
  position: relative; width: 220px; height: 220px; flex: none;
  border-radius: 50%; overflow: hidden; touch-action: none; cursor: grab;
  background: var(--bg-alt); border: 1px solid var(--rule-soft);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7);
}
.cropper.dragging { cursor: grabbing; }
.cropper img { position: absolute; top: 0; left: 0; max-width: none; -webkit-user-drag: none; user-select: none; }
.crop-empty {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 13px; color: var(--ink-mute); pointer-events: none; text-align: center; padding: 0 24px;
}
.crop-empty[hidden] { display: none; }
.crop-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.crop-controls input[type=range] { width: 150px; accent-color: var(--mauve); }
.crop-controls input[type=range]:disabled { opacity: .4; }
.file-btn {
  cursor: pointer; padding: 8px 14px; font-size: 13px; font-weight: 700;
  color: #fff; background: var(--gradient); border-radius: 10px;
}
.link-btn {
  cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-mute);
  background: none; border: none; text-decoration: underline; text-underline-offset: 3px;
}
.link-btn:hover { color: #B23B36; }
.crop-hint { font-size: 11.5px; color: var(--ink-mute); text-align: center; max-width: 280px; }
.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 11px 13px; font-family: inherit; font-size: 14px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 11px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus { border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(181,129,163,0.15); }

/* 內部常用 APP 格狀清單 */
.app-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.app-tile {
  position: relative; display: flex; flex-direction: column; gap: 4px;
  padding: 15px 16px; background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: 14px; transition: transform .12s, border-color .15s, box-shadow .15s;
}
.app-tile:hover {
  transform: translateY(-2px); border-color: var(--rule);
  box-shadow: 0 14px 30px -22px rgba(31,24,20,0.35);
}
.app-ico {
  width: 34px; height: 34px; margin-bottom: 6px; display: grid; place-items: center;
  color: var(--mauve); background: #fff;
  border: 1px solid var(--rule-soft); border-radius: 10px;
}
.app-ico svg { width: 18px; height: 18px; }
.app-name { font-size: 14px; font-weight: 700; color: var(--ink); word-break: break-word; }
.app-desc {
  font-size: 12px; color: var(--ink-mute); word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 最新公告：左日期 + 右標題/類型 */
.feed { display: flex; flex-direction: column; }
.feed-item {
  position: relative; display: flex; gap: 16px; align-items: stretch;
  padding: 14px 4px; border-top: 1px solid var(--rule-soft);
}
.feed-item:first-child { border-top: none; }
.feed-date {
  flex: none; width: 56px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 0; background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 12px;
}
.feed-day { font-family: var(--num); font-size: 24px; font-weight: 800; line-height: 1; color: var(--ink); }
.feed-month { font-size: 11.5px; color: var(--ink-mute); margin-top: 4px; }
.feed-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.feed-type {
  align-self: flex-start; margin-bottom: 5px; padding: 2px 9px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}
.feed-title {
  font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 區段標題（其他視圖共用） */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin: 0 0 18px;
}
.section-title { font-size: 22px; font-weight: 700; color: var(--ink); }
.section-sub { font-size: 13px; color: var(--ink-mute); }

/* 快速連結 / 專案 / APP 卡片 */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tile {
  position: relative; display: flex; flex-direction: column; padding: 20px;
  background: #fff; border: 1px solid var(--rule); border-radius: 16px;
  transition: transform .12s, box-shadow .15s, border-color .15s;
}
.tile:hover {
  transform: translateY(-3px); border-color: var(--rule);
  box-shadow: 0 16px 36px -22px rgba(31,24,20,0.3);
}
.tile h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; word-break: break-word; }
.tile p { font-size: 13.5px; color: var(--ink-mute); word-break: break-word; }
.tile .cat {
  align-self: flex-start; margin-bottom: 11px; padding: 3px 10px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}
.tile .go {
  position: absolute; top: 18px; right: 18px; width: 16px; height: 16px;
  color: var(--ink-mute); opacity: 0; transition: opacity .15s, transform .15s;
}
.tile:hover .go { opacity: 1; transform: translate(2px, -2px); }

/* 公告（最新消息完整列表） */
.ann {
  position: relative; padding: 20px 22px 20px 26px; background: #fff;
  border: 1px solid var(--rule); border-radius: 16px; margin-bottom: 14px;
}
.ann::before {
  content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
  width: 4px; border-radius: 4px; background: var(--gradient);
}
.ann h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.ann time { font-size: 12px; color: var(--ink-mute); }
.ann p { margin-top: 8px; color: var(--ink-soft); white-space: pre-wrap; }

.note {
  padding: 18px 20px; background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
  font-size: 14px; color: var(--ink-soft);
}
.empty {
  color: var(--ink-mute); font-size: 14px; padding: 22px;
  background: #fff; border: 1px dashed var(--rule); border-radius: 16px; text-align: center;
}

/* 預留版位（尚未有內容的區塊） */
.placeholder {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 5px; padding: 48px 24px; color: var(--ink-mute);
  background: #fff; border: 1px dashed var(--rule); border-radius: 18px;
}
.ph-ico {
  width: 50px; height: 50px; display: grid; place-items: center; margin-bottom: 6px;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
}
.ph-ico svg { width: 24px; height: 24px; }
.ph-title { font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.ph-sub { font-size: 13px; color: var(--ink-mute); }

/* 設定列表 */
.set-list { display: flex; flex-direction: column; }
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 4px; border-top: 1px solid var(--rule-soft);
}
.set-row:first-child { border-top: none; }
.set-key { font-size: 14px; font-weight: 700; color: var(--ink); }
.set-val { font-size: 13.5px; color: var(--ink-mute); text-align: right; word-break: break-all; }

/* 管理員動作按鈕（編輯 / 刪除） */
.actions { position: absolute; top: 12px; right: 12px; display: none; gap: 6px; }
body.is-admin .ann .actions,
body.is-admin .tile .actions { display: flex; }
.tile:hover .go { opacity: 0; }
body:not(.is-admin) .tile:hover .go { opacity: 1; }
.act {
  width: 28px; height: 28px; padding: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  transition: color .15s, border-color .15s, background .15s;
}
.act svg { width: 15px; height: 15px; }
.act.edit:hover { color: var(--mauve); border-color: var(--mauve); background: #fff; }
.act.del:hover  { color: #B23B36; border-color: #E7B8B5; background: #fff; }

/* ---------- 員工專區儀表板 ---------- */
.nav-menu { display: flex; flex-direction: column; }

.dash-row { display: grid; gap: 16px; grid-template-columns: 320px 1fr; align-items: start; margin-bottom: 44px; }
.dash-row .section { margin-bottom: 0; }

/* 員工資料卡 */
.emp-card { background:#fff; border:1px solid var(--rule); border-radius:18px; padding:22px; }
.emp-top { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.emp-name { font-size:18px; font-weight:800; color:var(--ink); word-break:break-word; }
.emp-role { font-size:13px; color:var(--ink-mute); }
body.is-admin .emp-role { color:var(--mauve); font-weight:700; }
.emp-meta { display:flex; flex-direction:column; gap:14px; border-top:1px solid var(--rule-soft); padding-top:16px; margin:0; }
.emp-meta > div { display:flex; flex-direction:column; gap:3px; }
.emp-meta dt { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-mute); }
.emp-meta dd { font-size:14px; color:var(--ink); word-break:break-all; }

/* 公告精簡列（日期 + 標題 + 類型） */
.ann-mini { position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px; background:#fff; border:1px solid var(--rule); border-radius:14px; margin-bottom:10px; }
.ann-mini time { font-size:12.5px; color:var(--ink-mute); font-variant-numeric:tabular-nums; flex:none; width:92px; }
.ann-mini .am-title { flex:1; min-width:0; font-size:14.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.type-badge { flex:none; font-size:11px; font-weight:700; color:var(--mauve); background:var(--bg-alt); border:1px solid var(--rule-soft); border-radius:999px; padding:3px 10px; }
body.is-admin .ann-mini { padding-right:74px; }

/* 建置中提示 toast */
.toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width: 720px) {
  .dash-row { grid-template-columns: 1fr; }
  .ann-mini time { width:auto; }
}

/* ---------- 手機版：側邊欄收成頂部橫向列 ---------- */
.menu-toggle { display: none; }
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: sticky; top: 0; z-index: 20; height: auto;
    border-right: none; border-bottom: 1px solid var(--rule-soft);
    padding: 12px 16px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
  }
  .sidebar-logo { padding: 4px 4px 0; display: flex; align-items: center; justify-content: space-between; }
  .menu-toggle {
    display: inline-grid; place-items: center; width: 40px; height: 40px;
    background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
    cursor: pointer; color: var(--ink-soft);
  }
  .menu-toggle svg { width: 20px; height: 20px; }
  .sidebar .nav-scroll, .sidebar .side-foot { display: none; }
  .sidebar.open .nav-scroll { display: block; padding-top: 10px; }
  .sidebar.open .side-foot { display: block; margin-top: 10px; }
  .nav-group-title { padding-top: 10px; }
  .main { padding: 22px 18px 70px; }
  .topbar { padding: 22px 24px; }
  .topbar .bigdate { font-size: 32px; }
}
</style>

<script type="module">
import {
  auth, signOut, onAuthStateChanged, isAdmin, CATS,
  db, collection, doc, getDoc, getDocs, getDocsFromCache, deleteDoc,
  query, orderBy
} from "./assets/auth.js";

/* =========================================================
   PIANN 專屬：只有 PIANN 能看到「員工資料」選單。
   以登入信箱判定；若 PIANN 的帳號不同，改這裡即可（可填多個）。
   ========================================================= */
const PIANN_EMAILS = ['zqartworkofficial@gmail.com'];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* 只允許 http/https 連結，擋掉 javascript: 等危險協定 */
const safeUrl = (u) => /^https?:\/\//i.test(String(u ?? '').trim()) ? String(u).trim() : '#';

/* 管理員動作按鈕的圖示（鉛筆 / 垃圾桶） */
const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>`;
const ICON_GO = `<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>`;
const ICON_APP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;
const actions = (col, id) =>
  `<div class="actions">
     <button type="button" class="act edit" data-action="edit" data-col="${col}" data-id="${id}" title="編輯">${ICON_EDIT}</button>
     <button type="button" class="act del" data-action="delete" data-col="${col}" data-id="${id}" title="刪除">${ICON_TRASH}</button>
   </div>`;

const linksGrid = document.getElementById('linksGrid');
const annList   = document.getElementById('annList');
const loadError = document.getElementById('loadError');
const linksSub  = document.getElementById('linksSub');

/* 分類定義由 assets/auth.js 共用匯入（與 publish.html 一致；只取中文標籤） */
const catLabel = (id) => {
  const c = CATS.find(c => c.id === id);
  return c ? c.label['zh-TW'] : '';
};

/* ---------- 載入 APP 快速連結 ---------- */
let allLinks = [];
async function loadLinks() {
  const q = query(collection(db, 'links'), orderBy('createdAt', 'desc'));
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allLinks = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderLinks();
    }
  } catch (e) { /* 無快取則略過 */ }
  const snap = await getDocs(q);
  allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderLinks();
}

function renderLinks() {
  linksSub.textContent = allLinks.length ? `共 ${allLinks.length} 個` : '';
  if (!allLinks.length) {
    linksGrid.innerHTML = `<p class="empty">尚無連結。</p>`;
    return;
  }
  linksGrid.innerHTML = '';
  allLinks.forEach(v => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = safeUrl(v.url);
    a.target = '_blank'; a.rel = 'noopener';
    const label = catLabel(v.category);
    const tag = label ? `<span class="cat">${esc(label)}</span>` : '';
    a.innerHTML =
      `${actions('links', v.id)}${ICON_GO}
       ${tag}<h3>${esc(v.title)}</h3>
       <p>${esc(v.desc || '')}</p>`;
    linksGrid.appendChild(a);
  });
}

/* ---------- 載入公告（取前 5 則，格式：日期 + 標題 + 類型） ---------- */
let allAnns = [];
async function loadAnnouncements() {
  const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allAnns = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAnns();
    }
  } catch (e) { /* 無快取則略過 */ }
  const snap = await getDocs(q);
  allAnns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAnns();
}

function renderAnns() {
  if (!allAnns.length) {
    annList.innerHTML = `<p class="empty">尚無公告。</p>`;
  } else {
    allAnns.forEach(v => {
      const date = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleDateString('zh-TW') : '';
      const el = document.createElement('div');
      el.className = 'ann';
      el.innerHTML =
        `${actions('announcements', v.id)}
         <h3>${esc(v.title)}</h3>
         <time>${esc(date)}</time>
         <p>${esc(v.body)}</p>`;
      annList.appendChild(el);
    });
  }

  // 主控版：最新前 5 則（左日期 + 右標題/類型）
  dashFeed.innerHTML = '';
  if (!allAnns.length) {
    dashFeed.innerHTML = `<p class="empty">尚無公告。</p>`;
  } else {
    allAnns.slice(0, 5).forEach(v => {
      const d = v.createdAt?.toDate ? v.createdAt.toDate() : null;
      const day = d ? d.getDate() : '–';
      const month = d ? `${d.getMonth() + 1}月` : '';
      const el = document.createElement('div');
      el.className = 'feed-item';
      el.innerHTML =
        `<div class="feed-date">
           <span class="feed-day">${esc(day)}</span>
           <span class="feed-month">${esc(month)}</span>
         </div>
         <div class="feed-body">
           <span class="feed-type">公告</span>
           <span class="feed-title">${esc(v.title)}</span>
         </div>`;
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => showView('news'));
      dashFeed.appendChild(el);
    });
  }
  annList.innerHTML = '';
  allAnns.slice(0, 5).forEach(v => {
    const dt = v.createdAt?.toDate ? v.createdAt.toDate() : null;
    const date = dt
      ? `${dt.getFullYear()}/${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}`
      : '';
    const type = v.type || catLabel(v.category) || '公告';
    const el = document.createElement('div');
    el.className = 'ann-mini';
    el.innerHTML =
      `${actions('announcements', v.id)}
       <time>${esc(date)}</time>
       <span class="am-title">${esc(v.title)}</span>
       <span class="type-badge">${esc(type)}</span>`;
    annList.appendChild(el);
  });
}

async function loadAll() {
  loadError.style.display = 'none';
  try {
    await Promise.all([loadLinks(), loadAnnouncements()]);
  } catch (e) {
    loadError.style.display = 'block';
  }
}

/* ---------- 側邊欄互動 ----------
   主控版 → 捲到頂；公告區 / APP → 捲到對應區塊；
   標記 data-soon 的項目（專案 / 文件下載 / 員工資料 / 設定）內容明天再接，先以提示帶過。 */
const sidebar = document.getElementById('sidebar');
function closeMobileMenu() { sidebar.classList.remove('open'); }
document.getElementById('menuToggle').addEventListener('click', () =>
  sidebar.classList.toggle('open'));

let toastTimer;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.querySelectorAll('.nav-menu .nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.href) { location.href = btn.dataset.href; return; }   // 導向其他頁面（如員工資料後台）
    document.querySelectorAll('.nav-menu .nav-item')
      .forEach(b => b.classList.toggle('active', b === btn));
    if (btn.dataset.scroll) {
      const sec = document.getElementById(btn.dataset.scroll);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (btn.hasAttribute('data-soon')) {
      toast('此功能建置中，敬請期待');
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });   // 主控版
    }
    closeMobileMenu();
  });
});

/* ---------- 編輯 / 刪除（事件委派；後端規則再把關） ----------
   編輯導向發佈頁 publish.html（帶 type 與 id），刪除則就地處理。 */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.act');
  if (!btn) return;
  e.preventDefault();
  const { action, col, id } = btn.dataset;
  if (action === 'edit') {
    const type = col === 'links' ? 'link' : 'ann';
    location.href = `publish.html?type=${type}&id=${encodeURIComponent(id)}`;
    return;
  }
  if (action === 'delete') {
    if (!confirm('確定要刪除嗎？')) return;
    try {
      await deleteDoc(doc(db, col, id));
      await loadAll();
    } catch (err) { alert(err.message); }
  }
});

/* ---------- 員工資料卡同步（從 profiles 讀姓名／代稱／大頭照） ----------
   員工本人只讀得到自己那筆 profiles（安全規則把關），敏感欄位留在 staff。 */
function setAvatarEl(el, avatarUrl, initial) {
  if (avatarUrl) el.innerHTML = `<img src="${avatarUrl}" alt="">`;
  else el.textContent = initial;
}
async function loadProfile(email) {
  if (!email) return;
  try {
    const snap = await getDoc(doc(db, 'profiles', email.toLowerCase()));
    if (!snap.exists()) return;
    const p = snap.data();
    const dispName = String(p.name || p.alias || '').trim();
    if (dispName) {
      document.getElementById('empName').textContent = dispName;
      document.getElementById('empNameCard').textContent = dispName;
    }
    if (p.alias) {
      document.getElementById('empAlias').textContent = p.alias;
      document.getElementById('empAliasRow').style.display = '';
    }
    if (p.avatar) {
      const initial = ((dispName || email).trim()[0] || '·').toUpperCase();
      setAvatarEl(document.getElementById('avatar'), p.avatar, initial);
      setAvatarEl(document.getElementById('avatarBig'), p.avatar, initial);
    }
  } catch (e) { /* 沒有 profile 或讀取失敗則維持預設值 */ }
}

/* ---------- 驗證守門 ---------- */
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  const email = user.email || '';
  // 員工名稱：先用帳號顯示名稱／信箱 @ 前段作為預設，profiles 載入後再覆蓋為正式姓名
  const name = user.displayName || email.split('@')[0] || '成員';
  const initial = (name.trim()[0] || '·').toUpperCase();

  document.getElementById('userEmail').textContent = email;
  document.getElementById('avatar').textContent = initial;
  document.getElementById('empName').textContent = name;
  document.getElementById('empNameCard').textContent = name;
  document.getElementById('avatarBig').textContent = initial;
  document.getElementById('empEmail').textContent = email;

  document.body.classList.remove('checking');
  document.body.classList.add('ready');

  loadProfile(email);   // 同步資料卡的姓名／代稱／大頭照
  loadAll();   // 立即載入內容，不等管理員檢查完成
  isAdmin(user.uid).then(ok => {   // 並行檢查，完成後才顯示管理員介面（員工資料選單僅管理員/PIANN 可見）
    if (ok) {
      document.body.classList.add('is-admin');
      document.getElementById('userRole').textContent = '管理員';
      document.getElementById('empRoleCard').textContent = '管理員';
    }
  });
});

/* ---------- 登出 ---------- */
$('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  window.location.replace('login.html');
});

/* ---------- 今日日期（YYYY年MM月DD日） ---------- */
const _today = new Date();
document.getElementById('todayDate').textContent =
  `${_today.getFullYear()}年${String(_today.getMonth() + 1).padStart(2, '0')}月${String(_today.getDate()).padStart(2, '0')}日`;
</script>
