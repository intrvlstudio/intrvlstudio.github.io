<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INTRVL 內部專區 — INTRVL Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="alternate icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
  --num: "Manrope", var(--body);
  --sidebar-w: 248px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* 驗證完成前先全部隱藏，避免內容閃現 */
#gate { display: none; }
body.ready #gate { display: block; }
body.checking::after {
  content: ""; position: fixed; inset: 0; z-index: 1; background: var(--bg);
}
body.checking::before {
  content: ""; position: fixed; z-index: 2; left: 50%; top: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 3px solid var(--rule-soft); border-top-color: var(--mauve);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ 整體版面：側邊欄 + 主內容 ============ */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

/* ---------- 側邊欄 ---------- */
.sidebar {
  position: sticky; top: 0; align-self: start; height: 100vh;
  display: flex; flex-direction: column;
  background: #fff; border-right: 1px solid var(--rule-soft);
  padding: 22px 16px;
}
.sidebar-logo { padding: 6px 10px 22px; }
.sidebar-logo img { height: 24px; }

.nav-scroll { flex: 1; overflow-y: auto; }
.nav-group { margin-bottom: 8px; }
.nav-group-title {
  padding: 14px 12px 8px; font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute);
}
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 12px; margin-bottom: 2px; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 500; text-align: left;
  color: var(--ink-soft); background: none; border: none; border-radius: 10px;
  transition: background .14s, color .14s;
}
.nav-item:hover { background: var(--bg-alt); color: var(--ink); }
.nav-item.active { background: var(--bg-alt); color: var(--mauve); font-weight: 700; }
.nav-item.active .nav-ico { color: var(--mauve); }
.nav-ico { width: 18px; height: 18px; flex: none; color: var(--ink-mute); }
.nav-ico svg { width: 100%; height: 100%; display: block; }
.nav-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-count {
  font-size: 12px; font-weight: 700; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: 999px; padding: 1px 8px; min-width: 24px; text-align: center;
}
.nav-item.active .nav-count { color: var(--mauve); border-color: var(--rule); }

/* ---------- 側邊欄底部：登出 ---------- */
.side-foot { padding-top: 16px; margin-top: 8px; border-top: 1px solid var(--rule-soft); }
.btn-out {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 10px 14px; cursor: pointer; font-family: inherit;
  font-size: 13.5px; font-weight: 600; border-radius: 11px;
  color: var(--ink-soft); background: #fff; border: 1px solid var(--rule);
  transition: background .15s;
}
.btn-out:hover { background: var(--bg-alt); }
.btn-out .ico { width: 16px; height: 16px; flex: none; }

/* 管理員專用元素（如「發佈」按鈕 / 員工資料後台入口），非管理員隱藏 */
.admin-only { display: none; }
body.is-admin .admin-only { display: inline-flex; }
body.is-admin .nav-item.admin-only { display: flex; }

/* ---------- 主內容 ---------- */
.main { padding: 30px 40px 80px; max-width: 1180px; }

/* 視圖切換：預設隱藏，.active 才顯示 */
.view { display: none; }
.view.active { display: block; }

/* ============ 第一列：頁首（INTRVL內部專區 + 日期） ============ */
.topbar {
  position: relative; overflow: hidden;
  padding: 28px 34px; margin-bottom: 26px;
  background: var(--gradient); border-radius: 22px; color: #fff;
}
.topbar .eyebrow {
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,0.9); margin-bottom: 8px;
}
.topbar .bigdate {
  font-family: var(--num); font-size: 40px; font-weight: 800;
  letter-spacing: .01em; line-height: 1;
}
.topbar .weekday { font-size: 14px; color: rgba(255,255,255,0.92); margin-top: 10px; }
.topbar::before {
  content: ""; position: absolute; right: -40px; top: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
}

/* ============ 第二列：左右兩欄 ============ */
.dash-grid { display: grid; gap: 22px; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.dash-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

/* 卡片容器 */
.card {
  background: #fff; border: 1px solid var(--rule); border-radius: 18px;
  padding: 22px 24px;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px;
}
.card-title { font-size: 16px; font-weight: 700; color: var(--ink); }
.card-sub { font-size: 12.5px; color: var(--ink-mute); }
.card-link {
  font-size: 12.5px; font-weight: 700; color: var(--mauve);
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
}
.card-link svg { width: 13px; height: 13px; }

/* 員工資料卡 */
.profile { display: flex; align-items: flex-start; gap: 18px; }
.avatar {
  position: relative; width: 76px; height: 76px; flex: none; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 800;
  font-size: 30px; background: var(--gradient); text-transform: uppercase;
  overflow: hidden; box-shadow: inset 0 0 0 1px rgba(31,24,20,0.08);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-meta { min-width: 0; flex: 1; }
.profile-top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.profile-name {
  font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.2;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 帳號等級 tag（縮小） */
.role-pill {
  display: inline-block; padding: 1px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}
body.is-admin .role-pill { color: #fff; background: var(--gradient); border-color: transparent; }
.profile-alias { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
.profile-rows { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.profile-row { display: flex; gap: 10px; font-size: 12.5px; min-width: 0; }
.profile-row .pk { flex: none; width: 64px; color: var(--ink-mute); font-weight: 600; }
.profile-row .pv { color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 員工資料由管理員後台統一管理的小提示 */
.profile-managed {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule-soft);
  font-size: 12px; color: var(--ink-mute);
}

/* 內部常用 APP 格狀清單 */
.app-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.app-tile {
  position: relative; display: flex; flex-direction: column; gap: 4px;
  padding: 15px 16px; background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: 14px; transition: transform .12s, border-color .15s, box-shadow .15s;
}
.app-tile:hover {
  transform: translateY(-2px); border-color: var(--rule);
  box-shadow: 0 14px 30px -22px rgba(31,24,20,0.35);
}
.app-ico {
  width: 34px; height: 34px; margin-bottom: 6px; display: grid; place-items: center;
  color: var(--mauve); background: #fff;
  border: 1px solid var(--rule-soft); border-radius: 10px;
}
.app-ico svg { width: 18px; height: 18px; }
.app-name { font-size: 14px; font-weight: 700; color: var(--ink); word-break: break-word; }
.app-desc {
  font-size: 12px; color: var(--ink-mute); word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 最新公告：左日期 + 右標題/類型 */
.feed { display: flex; flex-direction: column; }
.feed-item {
  position: relative; display: flex; gap: 16px; align-items: stretch;
  padding: 14px 4px; border-top: 1px solid var(--rule-soft);
}
.feed-item:first-child { border-top: none; }
.feed-date {
  flex: none; width: 56px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 0; background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 12px;
}
.feed-day { font-family: var(--num); font-size: 24px; font-weight: 800; line-height: 1; color: var(--ink); }
.feed-month { font-size: 11.5px; color: var(--ink-mute); margin-top: 4px; }
.feed-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.feed-type {
  align-self: flex-start; margin-bottom: 5px; padding: 2px 9px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}
.feed-title {
  font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 區段標題（其他視圖共用） */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin: 0 0 18px;
}
.section-title { font-size: 22px; font-weight: 700; color: var(--ink); }
.section-sub { font-size: 13px; color: var(--ink-mute); }

/* 快速連結 / 專案 / APP 卡片 */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tile {
  position: relative; display: flex; flex-direction: column; padding: 20px;
  background: #fff; border: 1px solid var(--rule); border-radius: 16px;
  transition: transform .12s, box-shadow .15s, border-color .15s;
}
.tile:hover {
  transform: translateY(-3px); border-color: var(--rule);
  box-shadow: 0 16px 36px -22px rgba(31,24,20,0.3);
}
.tile h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; word-break: break-word; }
.tile p { font-size: 13.5px; color: var(--ink-mute); word-break: break-word; }
.tile .cat {
  align-self: flex-start; margin-bottom: 11px; padding: 3px 10px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}
.tile .go {
  position: absolute; top: 18px; right: 18px; width: 16px; height: 16px;
  color: var(--ink-mute); opacity: 0; transition: opacity .15s, transform .15s;
}
.tile:hover .go { opacity: 1; transform: translate(2px, -2px); }

/* 公告（最新消息完整列表） */
.ann {
  position: relative; padding: 20px 22px 20px 26px; background: #fff;
  border: 1px solid var(--rule); border-radius: 16px; margin-bottom: 14px;
}
.ann::before {
  content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
  width: 4px; border-radius: 4px; background: var(--gradient);
}
.ann h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.ann time { font-size: 12px; color: var(--ink-mute); }
.ann p { margin-top: 8px; color: var(--ink-soft); white-space: pre-wrap; }

.note {
  padding: 18px 20px; background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
  font-size: 14px; color: var(--ink-soft);
}
.empty {
  color: var(--ink-mute); font-size: 14px; padding: 22px;
  background: #fff; border: 1px dashed var(--rule); border-radius: 16px; text-align: center;
}

/* 預留版位（尚未有內容的區塊） */
.placeholder {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 5px; padding: 48px 24px; color: var(--ink-mute);
  background: #fff; border: 1px dashed var(--rule); border-radius: 18px;
}
.ph-ico {
  width: 50px; height: 50px; display: grid; place-items: center; margin-bottom: 6px;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
}
.ph-ico svg { width: 24px; height: 24px; }
.ph-title { font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.ph-sub { font-size: 13px; color: var(--ink-mute); }

/* 設定列表 */
.set-list { display: flex; flex-direction: column; }
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 4px; border-top: 1px solid var(--rule-soft);
}
.set-row:first-child { border-top: none; }
.set-key { font-size: 14px; font-weight: 700; color: var(--ink); }
.set-val { font-size: 13.5px; color: var(--ink-mute); text-align: right; word-break: break-all; }

/* 管理員動作按鈕（編輯 / 刪除） */
.actions { position: absolute; top: 12px; right: 12px; display: none; gap: 6px; }
body.is-admin .ann .actions,
body.is-admin .tile .actions { display: flex; }
.tile:hover .go { opacity: 0; }
body:not(.is-admin) .tile:hover .go { opacity: 1; }
.act {
  width: 28px; height: 28px; padding: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  transition: color .15s, border-color .15s, background .15s;
}
.act svg { width: 15px; height: 15px; }
.act.edit:hover { color: var(--mauve); border-color: var(--mauve); background: #fff; }
.act.del:hover  { color: #B23B36; border-color: #E7B8B5; background: #fff; }

/* ---------- 手機版：側邊欄收成頂部橫向列 ---------- */
.menu-toggle { display: none; }
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: sticky; top: 0; z-index: 20; height: auto;
    border-right: none; border-bottom: 1px solid var(--rule-soft);
    padding: 12px 16px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
  }
  .sidebar-logo { padding: 4px 4px 0; display: flex; align-items: center; justify-content: space-between; }
  .menu-toggle {
    display: inline-grid; place-items: center; width: 40px; height: 40px;
    background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
    cursor: pointer; color: var(--ink-soft);
  }
  .menu-toggle svg { width: 20px; height: 20px; }
  .sidebar .nav-scroll, .sidebar .side-foot { display: none; }
  .sidebar.open .nav-scroll { display: block; padding-top: 10px; }
  .sidebar.open .side-foot { display: block; margin-top: 10px; }
  .nav-group-title { padding-top: 10px; }
  .main { padding: 22px 18px 70px; }
  .topbar { padding: 22px 24px; }
  .topbar .bigdate { font-size: 32px; }
}
</style>
</head>
<body class="checking">

<div id="gate">
<div class="shell">

  <!-- ============ 側邊欄 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="index.html"><img src="assets/logo_h_en_short.svg" alt="INTRVL Studio"></a>
      <button class="menu-toggle" id="menuToggle" aria-label="選單">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>

    <div class="nav-scroll">
      <nav class="nav-group" id="mainNav">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
          <span class="nav-label">主控版</span>
        </button>

        <button class="nav-item" data-view="news">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>
          <span class="nav-label">最新消息</span>
          <span class="nav-count" id="newsCount"></span>
        </button>

        <button class="nav-item" data-view="projects">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>
          <span class="nav-label">專案內容</span>
          <span class="nav-count" id="projCount"></span>
        </button>

        <button class="nav-item" data-view="docs">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-7M9 14l3 3 3-3"/></svg></span>
          <span class="nav-label">文件下載</span>
        </button>

        <button class="nav-item" data-view="apps">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-label">APP</span>
          <span class="nav-count" id="appCount"></span>
        </button>

        <!-- 員工資料：管理員專屬，導向員工資料後台 staff.html -->
        <button class="nav-item admin-only" data-href="staff.html">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5.5 16a3.5 3.5 0 0 1 7 0"/><path d="M15 9h4M15 13h4"/></svg></span>
          <span class="nav-label">員工資料</span>
        </button>

        <button class="nav-item" data-view="settings">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          <span class="nav-label">設定</span>
        </button>
      </nav>
    </div>

    <div class="side-foot">
      <button class="btn-out" id="logoutBtn">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>登出</span>
      </button>
    </div>
  </aside>

  <!-- ============ 主內容 ============ -->
  <main class="main">

    <!-- 第一列：頁首（INTRVL內部專區 + 日期） -->
    <header class="topbar">
      <p class="eyebrow">INTRVL 內部專區</p>
      <div class="bigdate" id="bigDate"></div>
      <p class="weekday" id="weekday"></p>
    </header>

    <!-- ============ 主控版 ============ -->
    <section class="view active" id="view-dashboard">
      <div class="dash-grid">

        <!-- 左欄：員工資料卡 + 內部常用 APP -->
        <div class="dash-col">
          <div class="card">
            <div class="card-head">
              <span class="card-title">員工資料卡</span>
            </div>
            <div class="profile">
              <div class="avatar" id="dashAvatar">·</div>
              <div class="profile-meta">
                <div class="profile-top">
                  <span class="profile-name" id="dashName">員工姓名</span>
                  <span class="role-pill" id="dashRole">成員</span>
                </div>
                <div class="profile-alias" id="dashAlias">代稱 · —</div>
                <div class="profile-rows">
                  <div class="profile-row"><span class="pk">職稱</span><span class="pv" id="dashTitle">—</span></div>
                  <div class="profile-row"><span class="pk">電子郵件</span><span class="pv" id="dashEmail">—</span></div>
                </div>
                <p class="profile-managed">姓名、代稱、職稱與大頭照由管理員於員工資料後台統一維護。</p>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="card-title">內部常用 APP</span>
              <span class="card-link" data-goto="apps">全部
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </span>
            </div>
            <div class="app-grid" id="dashApps"></div>
          </div>
        </div>

        <!-- 右欄：最新前 5 則公告 -->
        <div class="dash-col">
          <div class="card">
            <div class="card-head">
              <span class="card-title">最新公告</span>
              <span class="card-link" data-goto="news">全部
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </span>
            </div>
            <div class="feed" id="dashFeed"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- ============ 最新消息 ============ -->
    <section class="view" id="view-news">
      <div class="section-head">
        <span class="section-title">最新消息</span>
        <span class="section-sub" id="newsSub"></span>
      </div>
      <div id="annList"></div>
    </section>

    <!-- ============ 專案內容 ============ -->
    <section class="view" id="view-projects">
      <div class="section-head">
        <span class="section-title">專案內容</span>
        <span class="section-sub" id="projSub"></span>
      </div>
      <div class="grid" id="projGrid"></div>
    </section>

    <!-- ============ 文件下載 ============ -->
    <section class="view" id="view-docs">
      <div class="section-head">
        <span class="section-title">文件下載</span>
      </div>
      <div class="placeholder">
        <span class="ph-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-7M9 14l3 3 3-3"/></svg></span>
        <p class="ph-title">文件下載</p>
        <p class="ph-sub">此版位預留給文件與資源下載，內容之後補上。</p>
      </div>
    </section>

    <!-- ============ APP ============ -->
    <section class="view" id="view-apps">
      <div class="section-head">
        <span class="section-title">內部常用 APP</span>
        <span class="section-sub" id="appSub"></span>
      </div>
      <div class="grid" id="appGrid"></div>
    </section>

    <!-- ============ 設定 ============ -->
    <section class="view" id="view-settings">
      <div class="section-head">
        <span class="section-title">設定</span>
      </div>
      <div class="card">
        <div class="set-list">
          <div class="set-row">
            <span class="set-key">登入帳號</span>
            <span class="set-val" id="setEmail"></span>
          </div>
          <div class="set-row">
            <span class="set-key">身分</span>
            <span class="set-val" id="setRole"></span>
          </div>
          <div class="set-row admin-only" style="display:none;">
            <span class="set-key">員工資料後台</span>
            <a class="card-link" href="staff.html">前往管理
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </div>
          <div class="set-row admin-only" style="display:none;">
            <span class="set-key">發佈內容</span>
            <a class="card-link" href="publish.html">前往發佈頁
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </div>
          <div class="set-row">
            <span class="set-key">回到官網</span>
            <a class="card-link" href="index.html">INTRVL Studio
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </div>
        </div>
      </div>
    </section>

    <div class="note" id="loadError" style="display:none; margin-top:24px;">
      無法載入內容。請確認已啟用 Firestore 並發布安全規則（見 MEMBERS_SETUP.md）。
    </div>
  </main>

</div>
</div>

<script type="module">
import {
  auth, signOut, onAuthStateChanged, isAdmin, CATS,
  db, collection, doc, getDoc, getDocs, getDocsFromCache, deleteDoc,
  query, orderBy
} from "./assets/auth.js";

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* 只允許 http/https 連結，擋掉 javascript: 等危險協定 */
const safeUrl = (u) => /^https?:\/\//i.test(String(u ?? '').trim()) ? String(u).trim() : '#';

/* 管理員動作按鈕的圖示（鉛筆 / 垃圾桶） */
const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>`;
const ICON_GO = `<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>`;
const ICON_APP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;
const actions = (col, id) =>
  `<div class="actions">
     <button type="button" class="act edit" data-action="edit" data-col="${col}" data-id="${id}" title="編輯">${ICON_EDIT}</button>
     <button type="button" class="act del" data-action="delete" data-col="${col}" data-id="${id}" title="刪除">${ICON_TRASH}</button>
   </div>`;

/* 分類定義由 assets/auth.js 共用匯入 */
const catLabel = (id) => {
  const c = CATS.find(c => c.id === id);
  return c ? c.label['zh-TW'] : '';
};

/* ---------- DOM 參照 ---------- */
const $ = (id) => document.getElementById(id);
const projGrid = $('projGrid');
const appGrid  = $('appGrid');
const annList  = $('annList');
const dashApps = $('dashApps');
const dashFeed = $('dashFeed');
const loadError = $('loadError');

/* ---------- 視圖切換 ---------- */
const sidebar = $('sidebar');
function closeMobileMenu() { sidebar.classList.remove('open'); }
function showView(name) {
  document.querySelectorAll('.view').forEach(v =>
    v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('#mainNav .nav-item').forEach(b =>
    b.classList.toggle('active', b.dataset.view === name));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  closeMobileMenu();
}
$('mainNav').addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-item');
  if (!btn) return;
  if (btn.dataset.href) { location.href = btn.dataset.href; return; }   // 導向其他頁面（如員工資料後台）
  showView(btn.dataset.view);
});
/* 主控版的「全部」捷徑 */
document.querySelectorAll('[data-goto]').forEach(el =>
  el.addEventListener('click', () => showView(el.dataset.goto)));

/* ---------- 載入快速連結（專案 / APP 共用 links 集合） ---------- */
let allLinks = [];
async function loadLinks() {
  const q = query(collection(db, 'links'), orderBy('createdAt', 'desc'));
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allLinks = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderLinks();
    }
  } catch (e) { /* 無快取則略過 */ }
  const snap = await getDocs(q);
  allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderLinks();
}

/* 連結卡片（專案內容 / APP 視圖共用） */
function linkTile(v) {
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = safeUrl(v.url);
  a.target = '_blank'; a.rel = 'noopener';
  const label = catLabel(v.category);
  const tag = label ? `<span class="cat">${esc(label)}</span>` : '';
  a.innerHTML =
    `${actions('links', v.id)}${ICON_GO}
     ${tag}<h3>${esc(v.title)}</h3>
     <p>${esc(v.desc || '')}</p>`;
  return a;
}

/* 主控版的 APP 小卡 */
function appTile(v) {
  const a = document.createElement('a');
  a.className = 'app-tile';
  a.href = safeUrl(v.url);
  a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML =
    `<span class="app-ico">${ICON_APP}</span>
     <span class="app-name">${esc(v.title)}</span>
     <span class="app-desc">${esc(v.desc || '')}</span>`;
  return a;
}

function renderLinks() {
  const projects = allLinks.filter(v => (v.category || '') === 'project');
  // 專案內容
  $('projCount').textContent = projects.length;
  $('projSub').textContent = projects.length ? `共 ${projects.length} 個專案` : '';
  projGrid.innerHTML = '';
  if (!projects.length) projGrid.innerHTML = `<p class="empty">尚無專案連結。</p>`;
  else projects.forEach(v => projGrid.appendChild(linkTile(v)));

  // APP（用全部連結）
  $('appCount').textContent = allLinks.length;
  $('appSub').textContent = allLinks.length ? `共 ${allLinks.length} 個 APP` : '';
  appGrid.innerHTML = '';
  if (!allLinks.length) appGrid.innerHTML = `<p class="empty">尚無連結。</p>`;
  else allLinks.forEach(v => appGrid.appendChild(linkTile(v)));

  // 主控版：內部常用 APP（取前 6 個）
  dashApps.innerHTML = '';
  if (!allLinks.length) dashApps.innerHTML = `<p class="empty" style="grid-column:1/-1;">尚無 APP。</p>`;
  else allLinks.slice(0, 6).forEach(v => dashApps.appendChild(appTile(v)));
}

/* ---------- 載入公告 ---------- */
let allAnns = [];
async function loadAnnouncements() {
  const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allAnns = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAnns();
    }
  } catch (e) { /* 無快取則略過 */ }
  const snap = await getDocs(q);
  allAnns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAnns();
}

function renderAnns() {
  $('newsCount').textContent = allAnns.length;
  $('newsSub').textContent = allAnns.length ? `共 ${allAnns.length} 則公告` : '';

  // 最新消息完整列表
  annList.innerHTML = '';
  if (!allAnns.length) {
    annList.innerHTML = `<p class="empty">尚無公告。</p>`;
  } else {
    allAnns.forEach(v => {
      const date = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleDateString('zh-TW') : '';
      const el = document.createElement('div');
      el.className = 'ann';
      el.innerHTML =
        `${actions('announcements', v.id)}
         <h3>${esc(v.title)}</h3>
         <time>${esc(date)}</time>
         <p>${esc(v.body)}</p>`;
      annList.appendChild(el);
    });
  }

  // 主控版：最新前 5 則（左日期 + 右標題/類型）
  dashFeed.innerHTML = '';
  if (!allAnns.length) {
    dashFeed.innerHTML = `<p class="empty">尚無公告。</p>`;
  } else {
    allAnns.slice(0, 5).forEach(v => {
      const d = v.createdAt?.toDate ? v.createdAt.toDate() : null;
      const day = d ? d.getDate() : '–';
      const month = d ? `${d.getMonth() + 1}月` : '';
      const el = document.createElement('div');
      el.className = 'feed-item';
      el.innerHTML =
        `<div class="feed-date">
           <span class="feed-day">${esc(day)}</span>
           <span class="feed-month">${esc(month)}</span>
         </div>
         <div class="feed-body">
           <span class="feed-type">公告</span>
           <span class="feed-title">${esc(v.title)}</span>
         </div>`;
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => showView('news'));
      dashFeed.appendChild(el);
    });
  }
}

async function loadAll() {
  loadError.style.display = 'none';
  try {
    await Promise.all([loadLinks(), loadAnnouncements()]);
  } catch (e) {
    loadError.style.display = 'block';
  }
}

/* ---------- 手機版選單收合 ---------- */
$('menuToggle').addEventListener('click', () => sidebar.classList.toggle('open'));

/* ---------- 編輯 / 刪除（事件委派；後端規則再把關） ---------- */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.act');
  if (!btn) return;
  e.preventDefault();
  const { action, col, id } = btn.dataset;
  if (action === 'edit') {
    const type = col === 'links' ? 'link' : 'ann';
    location.href = `publish.html?type=${type}&id=${encodeURIComponent(id)}`;
    return;
  }
  if (action === 'delete') {
    if (!confirm('確定要刪除嗎？')) return;
    try {
      await deleteDoc(doc(db, col, id));
      await loadAll();
    } catch (err) { alert(err.message); }
  }
});

/* ===========================================================
   員工資料卡（唯讀）：姓名 / 代稱 / 職稱 / 大頭照由管理員在員工資料
   後台（staff.html）統一維護，寫入 profiles/{email}。員工本人只讀
   得到自己那一筆（見 firestore.rules），敏感欄位留在 staff 集合。
   =========================================================== */
let currentEmail = '';
let profile = { name: '', alias: '', avatar: '', jobTitle: '' };

async function loadProfile(email) {
  profile = { name: '', alias: '', avatar: '', jobTitle: '' };
  if (!email) return;
  try {
    const snap = await getDoc(doc(db, 'profiles', email.toLowerCase()));
    if (snap.exists()) profile = Object.assign(profile, snap.data());
  } catch (e) { /* 沒有 profile 或讀取失敗就維持空白預設 */ }
}

function renderProfile() {
  const name = (profile.name || profile.alias || currentEmail.split('@')[0] || '成員').trim();
  const avatarEl = $('dashAvatar');
  if (profile.avatar) avatarEl.innerHTML = `<img src="${esc(profile.avatar)}" alt="">`;
  else avatarEl.textContent = (name[0] || currentEmail.trim()[0] || '·').toUpperCase();
  $('dashName').textContent = name;

  const aliasEl = $('dashAlias');
  if (profile.alias) { aliasEl.textContent = '代稱 · ' + profile.alias; aliasEl.style.display = ''; }
  else aliasEl.style.display = 'none';

  $('dashTitle').textContent = profile.jobTitle || '—';
  $('dashEmail').textContent = currentEmail;
}

/* ---------- 驗證守門 ---------- */
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  currentEmail = user.email || '';
  $('setEmail').textContent = currentEmail;
  $('setRole').textContent = '成員';

  renderProfile();                                 // 先用預設即時顯示
  loadProfile(currentEmail).then(renderProfile);   // 再帶入 profiles 後端資料

  document.body.classList.remove('checking');
  document.body.classList.add('ready');

  loadAll();
  isAdmin(user.uid).then(ok => {
    if (ok) {
      document.body.classList.add('is-admin');
      $('dashRole').textContent = '管理員';
      $('setRole').textContent = '管理員';
      document.querySelectorAll('.set-row.admin-only').forEach(el => el.style.display = 'flex');
    }
  });
});

/* ---------- 登出 ---------- */
$('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  window.location.replace('login.html');
});

/* ---------- 初始化日期（YYYY-MM-DD 大字 + 星期） ---------- */
const now = new Date();
const pad = (n) => String(n).padStart(2, '0');
$('bigDate').textContent = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
$('weekday').textContent = now.toLocaleDateString('zh-TW', { weekday: 'long' });
</script>
</body>
</html>
