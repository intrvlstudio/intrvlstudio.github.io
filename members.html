<title>成員專區 — INTRVL Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="alternate icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* 驗證完成前先全部隱藏，避免內容閃現 */
#gate { display: none; }
body.ready #gate { display: block; }
body.checking::after {
  content: ""; position: fixed; inset: 0; z-index: 1; background: var(--bg);
}
body.checking::before {
  content: ""; position: fixed; z-index: 2; left: 50%; top: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 3px solid var(--rule-soft); border-top-color: var(--mauve);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.nav {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 16px 28px;
  background: rgba(251,246,238,0.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule-soft);
}
.nav .logo { height: 24px; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.user-email { font-size: 13px; color: var(--ink-mute); max-width: 200px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* nav 按鈕（圖示 + 文字；手機只留圖示） */
.btn-out, .btn-pub {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 700; border-radius: 10px;
  transition: background .15s, filter .15s;
}
.btn-out {
  color: var(--ink-soft); background: #fff; border: 1px solid var(--rule); font-weight: 600;
}
.btn-out:hover { background: var(--bg-alt); }
.btn-pub {
  color: #fff; background: var(--gradient); border: none;
}
.btn-pub:hover { filter: brightness(1.04); }
.btn-out .ico, .btn-pub .ico { width: 16px; height: 16px; flex: none; }

/* 管理員專用元素（如「發佈」按鈕），非管理員隱藏 */
.admin-only { display: none; }
body.is-admin .admin-only { display: inline-flex; }

.wrap { max-width: 860px; margin: 0 auto; padding: 56px 28px 90px; }
.eyebrow {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 8px;
}
h1 { font-size: 34px; font-weight: 700; margin-bottom: 10px; }
.lede { color: var(--ink-soft); margin-bottom: 40px; max-width: 60ch; }

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin: 48px 0 16px;
}
.section-title {
  font-size: 13px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute);
}

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tile {
  position: relative; display: block; padding: 22px; background: #fff;
  border: 1px solid var(--rule); border-radius: 16px;
  transition: transform .12s, box-shadow .15s;
}
.tile:hover { transform: translateY(-3px); box-shadow: 0 16px 36px -22px rgba(31,24,20,0.25); }
.tile h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; word-break: break-word; }
.tile p { font-size: 13.5px; color: var(--ink-mute); word-break: break-word; }
.tile .cat {
  display: inline-block; margin-bottom: 9px; padding: 2px 9px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}

/* 分類篩選下拉 */
.cat-filter {
  padding: 8px 13px; font-family: inherit; font-size: 14px;
  color: var(--ink); background: #fff; border: 1px solid var(--rule);
  border-radius: 10px; outline: none; cursor: pointer;
}
.cat-filter:focus {
  border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(181,129,163,0.15);
}

.ann { padding: 20px 22px; background: #fff; border: 1px solid var(--rule);
  border-radius: 14px; margin-bottom: 14px; position: relative; }
.ann h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.ann time { font-size: 12px; color: var(--ink-mute); }
.ann p { margin-top: 8px; color: var(--ink-soft); white-space: pre-wrap; }

.note {
  padding: 18px 20px; background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
  font-size: 14px; color: var(--ink-soft);
}
.empty { color: var(--ink-mute); font-size: 14px; padding: 4px 2px; }

/* 管理員動作按鈕（編輯 / 刪除，管理員才看得到） */
.actions {
  position: absolute; top: 10px; right: 10px;
  display: none; gap: 6px;
}
body.is-admin .actions { display: flex; }
.act {
  width: 28px; height: 28px; padding: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  transition: color .15s, border-color .15s, background .15s;
}
.act svg { width: 15px; height: 15px; }
.act.edit:hover  { color: var(--mauve); border-color: var(--mauve); background: #fff; }
.act.del:hover   { color: #B23B36; border-color: #E7B8B5; background: #fff; }

/* 手機版：登出 / 發佈按鈕只留圖示 */
@media (max-width: 600px) {
  .nav { padding: 14px 18px; }
  .btn-out .btn-label, .btn-pub .btn-label { display: none; }
  .btn-out, .btn-pub { padding: 9px; }
  .user-email { display: none; }
}
</style>
</head>
<body class="checking">

<div id="gate">
  <nav class="nav">
    <a href="index.html"><img class="logo" src="assets/logo_en.svg" alt="INTRVL Studio"></a>
    <div class="nav-right">
      <a class="btn-pub admin-only" href="publish.html" aria-label="發佈" title="發佈">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">發佈</span>
      </a>
      <span class="user-email" id="userEmail"></span>
      <button class="btn-out" id="logoutBtn" aria-label="登出" title="登出">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="btn-label">登出</span>
      </button>
    </div>
  </nav>

  <main class="wrap">
    <p class="eyebrow">成員專區</p>
    <h1>歡迎回來</h1>
    <p class="lede">INTRVL Studio 成員的內部資源與公告。</p>

    <!-- ============ QUICK LINKS ============ -->
    <div class="section-head">
      <span class="section-title">快速連結</span>
      <select class="cat-filter" id="catFilter" aria-label="依分類篩選"></select>
    </div>
    <div class="grid" id="linksGrid"></div>

    <!-- ============ ANNOUNCEMENTS ============ -->
    <div class="section-head">
      <span class="section-title">公告</span>
    </div>
    <div id="annList"></div>

    <div class="note" id="loadError" style="display:none; margin-top:28px;">
      無法載入內容。請確認已啟用 Firestore 並發布安全規則（見 MEMBERS_SETUP.md）。
    </div>
  </main>
</div>

<script type="module">
import {
  auth, signOut, onAuthStateChanged, isAdmin, CATS,
  db, collection, doc, getDocs, getDocsFromCache, deleteDoc,
  query, orderBy
} from "./assets/auth.js";

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* 只允許 http/https 連結，擋掉 javascript: 等危險協定 */
const safeUrl = (u) => /^https?:\/\//i.test(String(u ?? '').trim()) ? String(u).trim() : '#';

/* 管理員動作按鈕的圖示（鉛筆 / 垃圾桶） */
const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>`;
const actions = (col, id) =>
  `<div class="actions">
     <button type="button" class="act edit" data-action="edit" data-col="${col}" data-id="${id}" title="編輯">${ICON_EDIT}</button>
     <button type="button" class="act del" data-action="delete" data-col="${col}" data-id="${id}" title="刪除">${ICON_TRASH}</button>
   </div>`;

const linksGrid = document.getElementById('linksGrid');
const annList   = document.getElementById('annList');
const loadError = document.getElementById('loadError');
const catFilter = document.getElementById('catFilter');

/* 分類定義由 assets/auth.js 共用匯入（與 publish.html 一致；只取中文標籤） */
const catLabel = (id) => {
  const c = CATS.find(c => c.id === id);
  return c ? c.label['zh-TW'] : '';
};

/* 填入分類篩選下拉，並保留現有選擇 */
function populateCatControls() {
  const prevFilter = catFilter.value || 'all';
  catFilter.innerHTML =
    `<option value="all">全部分類</option>` +
    CATS.map(c => `<option value="${c.id}">${esc(c.label['zh-TW'])}</option>`).join('');
  catFilter.value = prevFilter;
}

/* ---------- 載入快速連結 ---------- */
let allLinks = [];
async function loadLinks() {
  const q = query(collection(db, 'links'), orderBy('createdAt', 'desc'));
  // 先用本機快取即時顯示（重複造訪幾乎瞬間出現）
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allLinks = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderLinks();
    }
  } catch (e) { /* 無快取則略過 */ }
  // 再向伺服器取最新資料並更新畫面
  const snap = await getDocs(q);
  allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderLinks();
}

/* 依目前篩選分類渲染連結 */
function renderLinks() {
  const filter = catFilter.value || 'all';
  const items = filter === 'all'
    ? allLinks
    : allLinks.filter(v => (v.category || '') === filter);

  if (!items.length) {
    linksGrid.innerHTML = `<p class="empty">尚無連結。</p>`;
    return;
  }
  linksGrid.innerHTML = '';
  items.forEach(v => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = safeUrl(v.url);
    a.target = '_blank'; a.rel = 'noopener';
    const tag = v.category ? `<span class="cat">${esc(catLabel(v.category))}</span>` : '';
    a.innerHTML =
      `${actions('links', v.id)}
       ${tag}<h3>${esc(v.title)}</h3>
       <p>${esc(v.desc || '')}</p>`;
    linksGrid.appendChild(a);
  });
}

/* 切換篩選 → 重新渲染（不需重新查詢資料庫） */
catFilter.addEventListener('change', renderLinks);

/* ---------- 載入公告 ---------- */
let allAnns = [];
async function loadAnnouncements() {
  const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));
  // 先用本機快取即時顯示
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allAnns = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAnns();
    }
  } catch (e) { /* 無快取則略過 */ }
  // 再向伺服器取最新資料並更新畫面
  const snap = await getDocs(q);
  allAnns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAnns();
}

function renderAnns() {
  if (!allAnns.length) {
    annList.innerHTML = `<p class="empty">尚無公告。</p>`;
    return;
  }
  annList.innerHTML = '';
  allAnns.forEach(v => {
    const date = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleDateString('zh-TW') : '';
    const el = document.createElement('div');
    el.className = 'ann';
    el.innerHTML =
      `${actions('announcements', v.id)}
       <h3>${esc(v.title)}</h3>
       <time>${esc(date)}</time>
       <p>${esc(v.body)}</p>`;
    annList.appendChild(el);
  });
}

async function loadAll() {
  loadError.style.display = 'none';
  try {
    await Promise.all([loadLinks(), loadAnnouncements()]);
  } catch (e) {
    loadError.style.display = 'block';
  }
}

/* ---------- 編輯 / 刪除（事件委派；後端規則再把關） ----------
   編輯導向發佈頁 publish.html（帶 type 與 id），刪除則就地處理。 */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.act');
  if (!btn) return;
  e.preventDefault();
  const { action, col, id } = btn.dataset;
  if (action === 'edit') {
    const type = col === 'links' ? 'link' : 'ann';
    location.href = `publish.html?type=${type}&id=${encodeURIComponent(id)}`;
    return;
  }
  if (action === 'delete') {
    if (!confirm('確定要刪除嗎？')) return;
    try {
      await deleteDoc(doc(db, col, id));
      await loadAll();
    } catch (err) { alert(err.message); }
  }
});

/* ---------- 驗證守門 ---------- */
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  document.getElementById('userEmail').textContent = user.email || '';
  document.body.classList.remove('checking');
  document.body.classList.add('ready');

  loadAll();   // 立即載入內容，不等管理員檢查完成
  isAdmin(user.uid).then(ok => {   // 並行檢查，完成後才顯示管理員介面
    if (ok) document.body.classList.add('is-admin');
  });
});

/* ---------- 登出 ---------- */
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  window.location.replace('login.html');
});

/* 初始化分類篩選下拉 */
populateCatControls();
</script>
</body>
