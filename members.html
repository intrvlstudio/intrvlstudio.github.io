<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* 驗證完成前先全部隱藏，避免內容閃現 */
#gate { display: none; }
body.ready #gate { display: block; }
body.checking::after {
  content: ""; position: fixed; inset: 0; z-index: 1; background: var(--bg);
}
body.checking::before {
  content: ""; position: fixed; z-index: 2; left: 50%; top: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 3px solid var(--rule-soft); border-top-color: var(--mauve);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.nav {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 16px 28px;
  background: rgba(251,246,238,0.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule-soft);
}
.nav .logo { height: 24px; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.user-email { font-size: 13px; color: var(--ink-mute); max-width: 200px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* nav 按鈕（圖示 + 文字；手機只留圖示） */
.btn-out, .btn-pub {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 700; border-radius: 10px;
  transition: background .15s, filter .15s;
}
.btn-out {
  color: var(--ink-soft); background: #fff; border: 1px solid var(--rule); font-weight: 600;
}
.btn-out:hover { background: var(--bg-alt); }
.btn-pub {
  color: #fff; background: var(--gradient); border: none;
}
.btn-pub:hover { filter: brightness(1.04); }
.btn-out .ico, .btn-pub .ico { width: 16px; height: 16px; flex: none; }

/* 管理員專用元素（如「發佈」按鈕），非管理員隱藏 */
.admin-only { display: none; }
body.is-admin .admin-only { display: inline-flex; }

.wrap { max-width: 860px; margin: 0 auto; padding: 56px 28px 90px; }
.eyebrow {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 8px;
}
h1 { font-size: 34px; font-weight: 700; margin-bottom: 10px; }
.lede { color: var(--ink-soft); margin-bottom: 40px; max-width: 60ch; }

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin: 48px 0 16px;
}
.section-title {
  font-size: 13px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute);
}

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tile {
  position: relative; display: block; padding: 22px; background: #fff;
  border: 1px solid var(--rule); border-radius: 16px;
  transition: transform .12s, box-shadow .15s;
}
.tile:hover { transform: translateY(-3px); box-shadow: 0 16px 36px -22px rgba(31,24,20,0.25); }
.tile h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; word-break: break-word; }
.tile p { font-size: 13.5px; color: var(--ink-mute); word-break: break-word; }
.tile .cat {
  display: inline-block; margin-bottom: 9px; padding: 2px 9px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}

/* 分類篩選下拉 */
.cat-filter {
  padding: 8px 13px; font-family: inherit; font-size: 14px;
  color: var(--ink); background: #fff; border: 1px solid var(--rule);
  border-radius: 10px; outline: none; cursor: pointer;
}
.cat-filter:focus {
  border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(181,129,163,0.15);
}

/* 專案傳送門 — 帶編號徽章的卡片 */
.portal { padding-right: 46px; }
.portal .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; margin-bottom: 12px;
  font-family: var(--display); font-size: 14px; font-weight: 700; color: #fff;
  background: var(--gradient); border-radius: 9px; letter-spacing: .02em;
}
.portal .go {
  position: absolute; top: 22px; right: 20px;
  font-size: 17px; color: var(--ink-mute); transition: transform .12s, color .12s;
}
.portal:hover .go { transform: translateX(3px); color: var(--mauve); }

/* 工作排程 — 橫幅卡片(漸層描邊) */
.schedule-card {
  position: relative; display: flex; align-items: center; gap: 16px;
  padding: 20px 24px; margin-bottom: 14px; border-radius: 16px;
  border: 1.5px solid transparent;
  background:
    linear-gradient(#fff, #fff) padding-box,
    var(--gradient) border-box;
  transition: transform .12s, box-shadow .15s;
}
.schedule-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px -22px rgba(31,24,20,0.25); }
.schedule-card .ico {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  font-size: 22px; background: var(--bg-alt); border-radius: 12px;
}
.schedule-card .meta { min-width: 0; }
.schedule-card .meta h3 { font-size: 17px; font-weight: 700; margin-bottom: 2px; word-break: break-word; }
.schedule-card .meta p { font-size: 13.5px; color: var(--ink-mute); word-break: break-word; }
.schedule-card .go { margin-left: auto; flex: none; font-size: 18px; color: var(--ink-mute);
  transition: transform .12s, color .12s; }
.schedule-card:hover .go { transform: translateX(3px); color: var(--mauve); }

/* 群組標題前的小圖示 */
.section-title .ico { margin-right: 6px; }

.ann { padding: 20px 22px; background: #fff; border: 1px solid var(--rule);
  border-radius: 14px; margin-bottom: 14px; position: relative; }
.ann h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.ann time { font-size: 12px; color: var(--ink-mute); }
.ann p { margin-top: 8px; color: var(--ink-soft); white-space: pre-wrap; }

.note {
  padding: 18px 20px; background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
  font-size: 14px; color: var(--ink-soft);
}
.empty { color: var(--ink-mute); font-size: 14px; padding: 4px 2px; }

/* 管理員動作按鈕（編輯 / 刪除，管理員才看得到） */
.actions {
  position: absolute; top: 10px; right: 10px;
  width: 26px; height: 26px; cursor: pointer; line-height: 1;
  font-size: 15px; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  display: none;
}
body.is-admin .del { display: block; }
.del:hover { color: #B23B36; border-color: #E7B8B5; }

/* 管理員編輯區 */
.admin-only { display: none; }
body.is-admin .admin-only { display: block; }
.editor {
  margin-top: 14px; padding: 20px; background: #fff;
  border: 1px dashed var(--mauve); border-radius: 16px;
}
.editor .row { display: flex; gap: 10px; flex-wrap: wrap; }
.editor input, .editor textarea, .editor select {
  flex: 1 1 180px; padding: 10px 13px; font-family: inherit; font-size: 14px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--rule);
  border-radius: 10px; outline: none; margin-bottom: 10px; resize: vertical;
}
.editor input:focus, .editor textarea:focus, .editor select:focus {
  border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(181,129,163,0.15);
}
.editor select { flex-basis: 100%; cursor: pointer; }
.editor textarea { flex-basis: 100%; min-height: 70px; }
.editor button {
  padding: 10px 20px; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 700; color: #fff;
  background: var(--gradient); border: none; border-radius: 10px;
}
.act svg { width: 15px; height: 15px; }
.act.edit:hover  { color: var(--mauve); border-color: var(--mauve); background: #fff; }
.act.del:hover   { color: #B23B36; border-color: #E7B8B5; background: #fff; }

/* 手機版：登出 / 發佈按鈕只留圖示 */
@media (max-width: 600px) {
  .nav { padding: 14px 18px; }
  .btn-out .btn-label, .btn-pub .btn-label { display: none; }
  .btn-out, .btn-pub { padding: 9px; }
  .user-email { display: none; }
}
</style>
</head>
<body class="checking">

<div id="gate">
  <nav class="nav">
    <a href="index.html"><img class="logo" src="assets/logo_en.svg" alt="INTRVL Studio"></a>
    <div class="nav-right">
      <a class="btn-pub admin-only" href="publish.html" aria-label="發佈" title="發佈">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">發佈</span>
      </a>
      <span class="user-email" id="userEmail"></span>
      <button class="btn-out" id="logoutBtn" aria-label="登出" title="登出">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="btn-label">登出</span>
      </button>
    </div>
  </nav>

  <main class="wrap">
    <p class="eyebrow">成員專區</p>
    <h1>歡迎回來</h1>
    <p class="lede">INTRVL Studio 成員的內部資源與公告。</p>

    <!-- ============ 專案傳送門 ============ -->
    <div class="section-head">
      <span class="section-title">
        <span class="ico">🎬</span>
        <span class="lang-en">Project Portals</span>
        <span class="lang-zh">專案傳送門</span>
        <span class="lang-ko">프로젝트 포털</span>
      </span>
    </div>
    <div class="grid" id="projectGrid"></div>

    <!-- ============ 工作排程 ============ -->
    <div class="section-head">
      <span class="section-title">
        <span class="ico">🗓</span>
        <span class="lang-en">Schedule</span>
        <span class="lang-zh">工作排程</span>
        <span class="lang-ko">일정</span>
      </span>
    </div>
    <div id="scheduleList"></div>

    <!-- ============ 快速連結（其他） ============ -->
    <div class="section-head">
      <span class="section-title">
        <span class="ico">🔗</span>
        <span class="lang-en">Quick Links</span>
        <span class="lang-zh">快速連結</span>
        <span class="lang-ko">바로가기</span>
      </span>
    </div>
    <div class="grid" id="linksGrid"></div>

    <!-- 管理員：新增連結 -->
    <div class="admin-only">
      <form class="editor" id="linkForm">
        <p class="hint">
          <span class="lang-en">Admin · add a link</span>
          <span class="lang-zh">管理員 · 新增連結</span>
          <span class="lang-ko">관리자 · 링크 추가</span>
        </p>
        <div class="row">
          <select id="linkCat">
            <option value="project">🎬 專案傳送門 / Project</option>
            <option value="schedule">🗓 工作排程 / Schedule</option>
            <option value="general" selected>🔗 快速連結 / Quick Link</option>
          </select>
        </div>
        <div class="row">
          <input id="linkTitle" placeholder="Title / 標題" required>
          <input id="linkDesc" placeholder="Description / 說明">
        </div>
        <div class="row">
          <input id="linkUrl" type="url" placeholder="https://..." required>
          <button type="submit">
            <span class="lang-en">Add link</span>
            <span class="lang-zh">新增</span>
            <span class="lang-ko">추가</span>
          </button>
        </div>
      </form>
    </div>

    <!-- ============ ANNOUNCEMENTS ============ -->
    <div class="section-head">
      <span class="section-title">公告</span>
    </div>
    <div id="annList"></div>

    <div class="note" id="loadError" style="display:none; margin-top:28px;">
      無法載入內容。請確認已啟用 Firestore 並發布安全規則（見 MEMBERS_SETUP.md）。
    </div>
  </main>
</div>

<script type="module">
import {
  auth, signOut, onAuthStateChanged, isAdmin, CATS,
  db, collection, doc, getDocs, getDocsFromCache, deleteDoc,
  query, orderBy
} from "./assets/auth.js";

const lang = () => document.documentElement.lang;
const txt = {
  confirmDel:  { 'zh-TW': '確定要刪除嗎？', en: 'Delete this item?', ko: '삭제하시겠습니까?' },
  noProjects:  { 'zh-TW': '尚無專案。', en: 'No projects yet.', ko: '아직 프로젝트가 없습니다.' },
  noSchedule:  { 'zh-TW': '尚無排程連結。', en: 'No schedule yet.', ko: '아직 일정이 없습니다.' },
  noLinks:     { 'zh-TW': '尚無連結。', en: 'No links yet.', ko: '아직 링크가 없습니다.' },
  noAnn:       { 'zh-TW': '尚無公告。', en: 'No announcements yet.', ko: '아직 공지가 없습니다.' }
};
const t = (k) => txt[k][lang()] || txt[k].en;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* 只允許 http/https 連結，擋掉 javascript: 等危險協定 */
const safeUrl = (u) => /^https?:\/\//i.test(String(u ?? '').trim()) ? String(u).trim() : '#';

const projectGrid  = document.getElementById('projectGrid');
const scheduleList = document.getElementById('scheduleList');
const linksGrid    = document.getElementById('linksGrid');
const annList      = document.getElementById('annList');
const loadError    = document.getElementById('loadError');

const CATS = ['project', 'schedule', 'general'];

/* 共用：刪除鈕（管理員才看得到，由 CSS 控制顯示） */
const delBtn = (id) =>
  `<button class="del" data-col="links" data-id="${id}" title="delete">✕</button>`;

/* ---------- 載入連結，依分類分桶渲染 ---------- */
async function loadLinks() {
  const q = query(collection(db, 'links'), orderBy('createdAt', 'desc'));
  // 先用本機快取即時顯示（重複造訪幾乎瞬間出現）
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allLinks = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderLinks();
    }
  } catch (e) { /* 無快取則略過 */ }
  // 再向伺服器取最新資料並更新畫面
  const snap = await getDocs(q);

  const buckets = { project: [], schedule: [], general: [] };
  snap.forEach(d => {
    const v = d.data();
    const cat = CATS.includes(v.category) ? v.category : 'general';
    buckets[cat].push({ id: d.id, v });
  });

  renderProjects(buckets.project);
  renderSchedule(buckets.schedule);
  renderGeneral(buckets.general);
}

/* 專案傳送門：最早新增的排前面，編號 01、02、03… */
function renderProjects(items) {
  if (!items.length) { projectGrid.innerHTML = `<p class="empty">${t('noProjects')}</p>`; return; }
  const ordered = items.slice().reverse();
  projectGrid.innerHTML = '';
  ordered.forEach((it, i) => {
    const v = it.v;
    const a = document.createElement('a');
    a.className = 'tile portal';
    a.href = safeUrl(v.url); a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML =
      `${delBtn(it.id)}
       <span class="num">${String(i + 1).padStart(2, '0')}</span>
       <span class="go">→</span>
       <h3>${esc(v.title)}</h3>
       <p>${esc(v.desc || '')}</p>`;
    projectGrid.appendChild(a);
  });
}

/* 工作排程：橫幅卡片 */
function renderSchedule(items) {
  if (!items.length) { scheduleList.innerHTML = `<p class="empty">${t('noSchedule')}</p>`; return; }
  scheduleList.innerHTML = '';
  items.forEach(it => {
    const v = it.v;
    const a = document.createElement('a');
    a.className = 'schedule-card';
    a.href = safeUrl(v.url); a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML =
      `${delBtn(it.id)}
       <span class="ico">🗓</span>
       <span class="meta"><h3>${esc(v.title)}</h3><p>${esc(v.desc || '')}</p></span>
       <span class="go">→</span>`;
    scheduleList.appendChild(a);
  });
}

/* 快速連結（其他） */
function renderGeneral(items) {
  if (!items.length) { linksGrid.innerHTML = `<p class="empty">${t('noLinks')}</p>`; return; }
  linksGrid.innerHTML = '';
  items.forEach(it => {
    const v = it.v;
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = safeUrl(v.url); a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML =
      `${delBtn(it.id)}
       <h3>${esc(v.title)}</h3>
       <p>${esc(v.desc || '')}</p>`;
    linksGrid.appendChild(a);
  });
}

/* 切換篩選 → 重新渲染（不需重新查詢資料庫） */
catFilter.addEventListener('change', renderLinks);

/* ---------- 載入公告 ---------- */
let allAnns = [];
async function loadAnnouncements() {
  const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));
  // 先用本機快取即時顯示
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allAnns = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAnns();
    }
  } catch (e) { /* 無快取則略過 */ }
  // 再向伺服器取最新資料並更新畫面
  const snap = await getDocs(q);
  allAnns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAnns();
}

function renderAnns() {
  if (!allAnns.length) {
    annList.innerHTML = `<p class="empty">尚無公告。</p>`;
    return;
  }
  annList.innerHTML = '';
  allAnns.forEach(v => {
    const date = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleDateString('zh-TW') : '';
    const el = document.createElement('div');
    el.className = 'ann';
    el.innerHTML =
      `${actions('announcements', v.id)}
       <h3>${esc(v.title)}</h3>
       <time>${esc(date)}</time>
       <p>${esc(v.body)}</p>`;
    annList.appendChild(el);
  });
}

async function loadAll() {
  loadError.style.display = 'none';
  try {
    await Promise.all([loadLinks(), loadAnnouncements()]);
  } catch (e) {
    loadError.style.display = 'block';
  }
}

/* ---------- 編輯 / 刪除（事件委派；後端規則再把關） ----------
   編輯導向發佈頁 publish.html（帶 type 與 id），刪除則就地處理。 */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.act');
  if (!btn) return;
  e.preventDefault();
  if (!confirm(t('confirmDel'))) return;
  try {
    await deleteDoc(doc(db, btn.dataset.col, btn.dataset.id));
    await loadAll();
  } catch (err) { alert(err.message); }
});

/* ---------- 新增連結 ---------- */
document.getElementById('linkForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = e.target.querySelector('button'); b.disabled = true;
  try {
    await addDoc(collection(db, 'links'), {
      title:    document.getElementById('linkTitle').value.trim(),
      desc:     document.getElementById('linkDesc').value.trim(),
      url:      document.getElementById('linkUrl').value.trim(),
      category: document.getElementById('linkCat').value,
      createdAt: serverTimestamp()
    });
    e.target.reset();
    await loadLinks();
  } catch (err) { alert(err.message); }
  finally { b.disabled = false; }
});

/* ---------- 新增公告 ---------- */
document.getElementById('annForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = e.target.querySelector('button'); b.disabled = true;
  try {
    await addDoc(collection(db, 'announcements'), {
      title: document.getElementById('annTitle').value.trim(),
      body:  document.getElementById('annBody').value.trim(),
      createdAt: serverTimestamp()
    });
    e.target.reset();
    await loadAnnouncements();
  } catch (err) { alert(err.message); }
  finally { b.disabled = false; }
});

/* ---------- 驗證守門 ---------- */
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  document.getElementById('userEmail').textContent = user.email || '';
  document.body.classList.remove('checking');
  document.body.classList.add('ready');

  loadAll();   // 立即載入內容，不等管理員檢查完成
  isAdmin(user.uid).then(ok => {   // 並行檢查，完成後才顯示管理員介面
    if (ok) document.body.classList.add('is-admin');
  });
});

/* ---------- 登出 ---------- */
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  window.location.replace('login.html');
});

/* 初始化分類篩選下拉 */
populateCatControls();
</script>
</body>
</html>
