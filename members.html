<title>成員專區 — INTRVL Studio</title>
<meta name="robots" content="noindex">

<style>
:root {
  --bg: #FBF6EE; --bg-alt: #F4ECDD;
  --ink: #1F1814; --ink-soft: #4F4239; --ink-mute: #8E7C6E;
  --rule: #D9CFBE; --rule-soft: #EAE0CE;
  --peach: #F2A776; --pink: #E69BB6; --mauve: #B581A3;
  --gradient: linear-gradient(95deg, #F2B689 0%, #ECA4A8 30%, #DC97B9 60%, #B581A3 100%);
  --body: "Huninn", "Noto Sans TC", -apple-system, sans-serif;
  --sidebar-w: 248px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* 驗證完成前先全部隱藏，避免內容閃現 */
#gate { display: none; }
body.ready #gate { display: block; }
body.checking::after {
  content: ""; position: fixed; inset: 0; z-index: 1; background: var(--bg);
}
body.checking::before {
  content: ""; position: fixed; z-index: 2; left: 50%; top: 50%;
  width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 3px solid var(--rule-soft); border-top-color: var(--mauve);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ 整體版面：側邊欄 + 主內容 ============ */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

/* ---------- 側邊欄 ---------- */
.sidebar {
  position: sticky; top: 0; align-self: start; height: 100vh;
  display: flex; flex-direction: column;
  background: #fff; border-right: 1px solid var(--rule-soft);
  padding: 22px 16px;
}
.sidebar-logo { padding: 6px 10px 22px; }
.sidebar-logo img { height: 24px; }

.nav-group { margin-bottom: 8px; }
.nav-group-title {
  padding: 14px 12px 8px; font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute);
}
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 12px; margin-bottom: 2px; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 500; text-align: left;
  color: var(--ink-soft); background: none; border: none; border-radius: 10px;
  transition: background .14s, color .14s;
}
.nav-item:hover { background: var(--bg-alt); color: var(--ink); }
.nav-item.active { background: var(--bg-alt); color: var(--mauve); font-weight: 700; }
.nav-item.active .nav-ico { color: var(--mauve); }
.nav-ico { width: 18px; height: 18px; flex: none; color: var(--ink-mute); }
.nav-ico svg { width: 100%; height: 100%; display: block; }
.nav-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-count {
  font-size: 12px; font-weight: 700; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: 999px; padding: 1px 8px; min-width: 24px; text-align: center;
}
.nav-item.active .nav-count { color: var(--mauve); border-color: var(--rule); }

/* ---------- 側邊欄底部：使用者卡片 ---------- */
.side-foot { margin-top: auto; padding-top: 16px; }
.user-card {
  display: flex; align-items: center; gap: 11px; padding: 11px;
  background: var(--bg); border: 1px solid var(--rule-soft); border-radius: 14px;
  margin-bottom: 10px;
}
.avatar {
  width: 38px; height: 38px; flex: none; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 800;
  font-size: 16px; background: var(--gradient); text-transform: uppercase;
}
.user-meta { min-width: 0; }
.user-email {
  font-size: 12.5px; font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.user-role { font-size: 11px; color: var(--ink-mute); }
body.is-admin .user-role { color: var(--mauve); font-weight: 700; }

.side-actions { display: flex; flex-direction: column; gap: 8px; }
.btn-out, .btn-pub {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 14px; cursor: pointer; font-family: inherit;
  font-size: 13.5px; font-weight: 700; border-radius: 11px;
  transition: background .15s, filter .15s;
}
.btn-out {
  color: var(--ink-soft); background: #fff; border: 1px solid var(--rule); font-weight: 600;
}
.btn-out:hover { background: var(--bg-alt); }
.btn-pub { color: #fff; background: var(--gradient); border: none; }
.btn-pub:hover { filter: brightness(1.04); }
.btn-out .ico, .btn-pub .ico { width: 16px; height: 16px; flex: none; }

/* 管理員專用元素（如「發佈」按鈕），非管理員隱藏 */
.admin-only { display: none; }
body.is-admin .admin-only { display: inline-flex; }

/* ---------- 主內容 ---------- */
.main { padding: 30px 40px 80px; max-width: 1080px; }

/* 歡迎橫幅 */
.hero {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 30px 34px; margin-bottom: 34px;
  background: var(--gradient); border-radius: 22px; color: #fff;
}
.hero-text { position: relative; z-index: 1; }
.hero .eyebrow {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,0.85); margin-bottom: 6px;
}
.hero h1 { font-size: 30px; font-weight: 700; margin-bottom: 6px; }
.hero .date { font-size: 13.5px; color: rgba(255,255,255,0.92); }
.hero-art {
  width: 116px; flex: none; filter: drop-shadow(0 8px 18px rgba(31,24,20,0.18));
}
.hero-art img { width: 100%; }
.hero::before {
  content: ""; position: absolute; right: -40px; top: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
}

/* 區段標題 */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin: 0 0 16px;
}
.section-title { font-size: 18px; font-weight: 700; color: var(--ink); }
.section-sub { font-size: 13px; color: var(--ink-mute); }
.section { margin-bottom: 44px; scroll-margin-top: 20px; }

/* 快速連結卡片 */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tile {
  position: relative; display: flex; flex-direction: column; padding: 20px;
  background: #fff; border: 1px solid var(--rule); border-radius: 16px;
  transition: transform .12s, box-shadow .15s, border-color .15s;
}
.tile:hover {
  transform: translateY(-3px); border-color: var(--rule);
  box-shadow: 0 16px 36px -22px rgba(31,24,20,0.3);
}
.tile h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; word-break: break-word; }
.tile p { font-size: 13.5px; color: var(--ink-mute); word-break: break-word; }
.tile .cat {
  align-self: flex-start; margin-bottom: 11px; padding: 3px 10px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px;
}
.tile .go {
  position: absolute; top: 18px; right: 18px; width: 16px; height: 16px;
  color: var(--ink-mute); opacity: 0; transition: opacity .15s, transform .15s;
}
.tile:hover .go { opacity: 1; transform: translate(2px, -2px); }

/* 公告 */
.ann {
  position: relative; padding: 20px 22px 20px 26px; background: #fff;
  border: 1px solid var(--rule); border-radius: 16px; margin-bottom: 14px;
}
.ann::before {
  content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
  width: 4px; border-radius: 4px; background: var(--gradient);
}
.ann h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.ann time { font-size: 12px; color: var(--ink-mute); }
.ann p { margin-top: 8px; color: var(--ink-soft); white-space: pre-wrap; }

.note {
  padding: 18px 20px; background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
  font-size: 14px; color: var(--ink-soft);
}
.empty {
  color: var(--ink-mute); font-size: 14px; padding: 22px;
  background: #fff; border: 1px dashed var(--rule); border-radius: 16px; text-align: center;
}

/* ---------- 預留版位（尚未有內容的區塊，之後再補） ---------- */
.soon {
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: var(--ink-mute); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 999px; padding: 3px 10px;
}
.soon-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--peach); flex: none; }
.placeholder {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 5px; padding: 40px 24px; color: var(--ink-mute);
  background: #fff; border: 1px dashed var(--rule); border-radius: 18px;
}
.ph-ico {
  width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 6px;
  color: var(--mauve); background: var(--bg-alt);
  border: 1px solid var(--rule-soft); border-radius: 14px;
}
.ph-ico svg { width: 22px; height: 22px; }
.ph-title { font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.ph-sub { font-size: 13px; color: var(--ink-mute); }
/* 並排兩欄的預留版位（窄螢幕自動收成單欄） */
.ph-row { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 720px) { .ph-row { grid-template-columns: 1fr; } }

/* 管理員動作按鈕（編輯 / 刪除，管理員才看得到） */
.actions { position: absolute; top: 12px; right: 12px; display: none; gap: 6px; }
body.is-admin .ann .actions,
body.is-admin .tile .actions { display: flex; }
.tile:hover .go { opacity: 0; } /* 管理員 hover 時讓位給動作按鈕 */
body:not(.is-admin) .tile:hover .go { opacity: 1; }
.act {
  width: 28px; height: 28px; padding: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--ink-mute);
  background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  transition: color .15s, border-color .15s, background .15s;
}
.act svg { width: 15px; height: 15px; }
.act.edit:hover { color: var(--mauve); border-color: var(--mauve); background: #fff; }
.act.del:hover  { color: #B23B36; border-color: #E7B8B5; background: #fff; }

/* ---------- 員工專區儀表板 ---------- */
.nav-menu { display: flex; flex-direction: column; }

.dash-row { display: grid; gap: 16px; grid-template-columns: 320px 1fr; align-items: start; margin-bottom: 44px; }
.dash-row .section { margin-bottom: 0; }

/* 員工資料卡 */
.emp-card { background:#fff; border:1px solid var(--rule); border-radius:18px; padding:22px; }
.emp-top { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.emp-name { font-size:18px; font-weight:800; color:var(--ink); word-break:break-word; }
.emp-role { font-size:13px; color:var(--ink-mute); }
body.is-admin .emp-role { color:var(--mauve); font-weight:700; }
.emp-meta { display:flex; flex-direction:column; gap:14px; border-top:1px solid var(--rule-soft); padding-top:16px; margin:0; }
.emp-meta > div { display:flex; flex-direction:column; gap:3px; }
.emp-meta dt { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-mute); }
.emp-meta dd { font-size:14px; color:var(--ink); word-break:break-all; }

/* 公告精簡列（日期 + 標題 + 類型） */
.ann-mini { position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px; background:#fff; border:1px solid var(--rule); border-radius:14px; margin-bottom:10px; }
.ann-mini time { font-size:12.5px; color:var(--ink-mute); font-variant-numeric:tabular-nums; flex:none; width:92px; }
.ann-mini .am-title { flex:1; min-width:0; font-size:14.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.type-badge { flex:none; font-size:11px; font-weight:700; color:var(--mauve); background:var(--bg-alt); border:1px solid var(--rule-soft); border-radius:999px; padding:3px 10px; }
body.is-admin .ann-mini { padding-right:74px; }

/* 建置中提示 toast */
.toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width: 720px) {
  .dash-row { grid-template-columns: 1fr; }
  .ann-mini time { width:auto; }
}

/* ---------- 手機版：側邊欄收成頂部橫向列 ---------- */
.menu-toggle { display: none; }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: sticky; top: 0; z-index: 20; height: auto;
    border-right: none; border-bottom: 1px solid var(--rule-soft);
    padding: 12px 16px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
  }
  .sidebar-logo { padding: 4px 4px 0; display: flex; align-items: center; justify-content: space-between; }
  .menu-toggle {
    display: inline-grid; place-items: center; width: 40px; height: 40px;
    background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
    cursor: pointer; color: var(--ink-soft);
  }
  .menu-toggle svg { width: 20px; height: 20px; }
  /* 預設收合導覽與底部；展開時才顯示 */
  .sidebar .nav-scroll, .sidebar .side-foot { display: none; }
  .sidebar.open .nav-scroll { display: block; padding-top: 10px; }
  .sidebar.open .side-foot { display: block; margin-top: 10px; }
  .nav-group-title { padding-top: 10px; }
  .main { padding: 22px 18px 70px; }
  .hero { padding: 24px; }
  .hero h1 { font-size: 24px; }
  .hero-art { width: 84px; }
}
@media (max-width: 400px) { .hero-art { display: none; } }
</style>
</head>

      <div class="hero-text">
        <p class="eyebrow">INTRVL 內部空間</p>
        <h1>歡迎回來，<span id="empName">成員</span></h1>
        <p class="date" id="todayDate"></p>
      </div>
      <div class="hero-art"><img src="assets/icon_mark_white.svg" alt=""></div>
    </section>

    <!-- ============ 員工資料卡 + 前五則公告 ============ -->
    <div class="dash-row">
      <!-- 1. 員工資料卡 -->
      <section class="section" id="empSection">
        <div class="section-head"><span class="section-title">員工資料</span></div>
        <div class="emp-card">
          <div class="emp-top">
            <div class="avatar" id="avatarBig">·</div>
            <div>
              <div class="emp-name" id="empNameCard">—</div>
              <div class="emp-role" id="empRoleCard">成員</div>
            </div>
          </div>
          <dl class="emp-meta">
            <div><dt>電子郵件</dt><dd id="empEmail">—</dd></div>
          </dl>
        </div>
      </section>

      <!-- 2. 前五則公告（日期 + 標題 + 類型） -->
      <section class="section" id="annSection">
        <div class="section-head">
          <span class="section-title">最新公告</span>
          <span class="section-sub">前 5 則</span>
        </div>
        <div id="annList" class="ann-mini-list"></div>
      </section>
    </div>

    <!-- ============ 3. APP 快速連結 ============ -->
    <section class="section" id="appSection">
      <div class="section-head">
        <span class="section-title">APP 快速連結</span>
        <span class="section-sub" id="linksSub"></span>
      </div>
      <div class="grid" id="linksGrid"></div>
    </section>

    <div class="note" id="loadError" style="display:none;">
      無法載入內容。請確認已啟用 Firestore 並發布安全規則（見 MEMBERS_SETUP.md）。
    </div>
  </main>

</div>
</div>

<script type="module">
import {
  auth, signOut, onAuthStateChanged, isAdmin, CATS,
  db, collection, doc, getDocs, getDocsFromCache, deleteDoc,
  query, orderBy
} from "./assets/auth.js";

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* 只允許 http/https 連結，擋掉 javascript: 等危險協定 */
const safeUrl = (u) => /^https?:\/\//i.test(String(u ?? '').trim()) ? String(u).trim() : '#';

/* 管理員動作按鈕的圖示（鉛筆 / 垃圾桶） */
const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>`;
const ICON_GO = `<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>`;
const actions = (col, id) =>
  `<div class="actions">
     <button type="button" class="act edit" data-action="edit" data-col="${col}" data-id="${id}" title="編輯">${ICON_EDIT}</button>
     <button type="button" class="act del" data-action="delete" data-col="${col}" data-id="${id}" title="刪除">${ICON_TRASH}</button>
   </div>`;

const linksGrid = document.getElementById('linksGrid');
const annList   = document.getElementById('annList');
const loadError = document.getElementById('loadError');
const linksSub  = document.getElementById('linksSub');

/* 分類定義由 assets/auth.js 共用匯入（與 publish.html 一致；只取中文標籤） */
const catLabel = (id) => {
  const c = CATS.find(c => c.id === id);
  return c ? c.label['zh-TW'] : '';
};

/* ---------- 載入 APP 快速連結 ---------- */
let allLinks = [];
async function loadLinks() {
  const q = query(collection(db, 'links'), orderBy('createdAt', 'desc'));
  // 先用本機快取即時顯示（重複造訪幾乎瞬間出現）
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allLinks = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderLinks();
    }
  } catch (e) { /* 無快取則略過 */ }
  const snap = await getDocs(q);
  allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderLinks();
}

function renderLinks() {
  linksSub.textContent = allLinks.length ? `共 ${allLinks.length} 個` : '';
  if (!allLinks.length) {
    linksGrid.innerHTML = `<p class="empty">尚無連結。</p>`;
    return;
  }
  linksGrid.innerHTML = '';
  allLinks.forEach(v => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = safeUrl(v.url);
    a.target = '_blank'; a.rel = 'noopener';
    const label = catLabel(v.category);
    const tag = label ? `<span class="cat">${esc(label)}</span>` : '';
    a.innerHTML =
      `${actions('links', v.id)}${ICON_GO}
       ${tag}<h3>${esc(v.title)}</h3>
       <p>${esc(v.desc || '')}</p>`;
    linksGrid.appendChild(a);
  });
}

/* ---------- 載入公告（取前 5 則，格式：日期 + 標題 + 類型） ---------- */
let allAnns = [];
async function loadAnnouncements() {
  const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));
  try {
    const cached = await getDocsFromCache(q);
    if (!cached.empty) {
      allAnns = cached.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAnns();
    }
  } catch (e) { /* 無快取則略過 */ }
  const snap = await getDocs(q);
  allAnns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAnns();
}

function renderAnns() {
  if (!allAnns.length) {
    annList.innerHTML = `<p class="empty">尚無公告。</p>`;
    return;
  }
  annList.innerHTML = '';
  allAnns.slice(0, 5).forEach(v => {
    const dt = v.createdAt?.toDate ? v.createdAt.toDate() : null;
    const date = dt
      ? `${dt.getFullYear()}/${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}`
      : '';
    const type = v.type || catLabel(v.category) || '公告';
    const el = document.createElement('div');
    el.className = 'ann-mini';
    el.innerHTML =
      `${actions('announcements', v.id)}
       <time>${esc(date)}</time>
       <span class="am-title">${esc(v.title)}</span>
       <span class="type-badge">${esc(type)}</span>`;
    annList.appendChild(el);
  });
}

async function loadAll() {
  loadError.style.display = 'none';
  try {
    await Promise.all([loadLinks(), loadAnnouncements()]);
  } catch (e) {
    loadError.style.display = 'block';
  }
}

/* ---------- 側邊欄互動 ----------
   主控版 → 捲到頂；公告區 / APP → 捲到對應區塊；
   標記 data-soon 的項目（專案 / 文件下載 / 員工資料 / 設定）內容明天再接，先以提示帶過。 */
const sidebar = document.getElementById('sidebar');
function closeMobileMenu() { sidebar.classList.remove('open'); }
document.getElementById('menuToggle').addEventListener('click', () =>
  sidebar.classList.toggle('open'));

let toastTimer;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.querySelectorAll('.nav-menu .nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-menu .nav-item')
      .forEach(b => b.classList.toggle('active', b === btn));
    if (btn.dataset.scroll) {
      const sec = document.getElementById(btn.dataset.scroll);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (btn.hasAttribute('data-soon')) {
      toast('此功能建置中，敬請期待');
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });   // 主控版
    }
    closeMobileMenu();
  });
});

/* ---------- 編輯 / 刪除（事件委派；後端規則再把關） ----------
   編輯導向發佈頁 publish.html（帶 type 與 id），刪除則就地處理。 */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.act');
  if (!btn) return;
  e.preventDefault();
  const { action, col, id } = btn.dataset;
  if (action === 'edit') {
    const type = col === 'links' ? 'link' : 'ann';
    location.href = `publish.html?type=${type}&id=${encodeURIComponent(id)}`;
    return;
  }
  if (action === 'delete') {
    if (!confirm('確定要刪除嗎？')) return;
    try {
      await deleteDoc(doc(db, col, id));
      await loadAll();
    } catch (err) { alert(err.message); }
  }
});

/* ---------- 驗證守門 ---------- */
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  const email = user.email || '';
  // 員工名稱：優先用帳號顯示名稱，否則取信箱 @ 前段（員工資料完成後可改為從後台帶入）
  const name = user.displayName || email.split('@')[0] || '成員';
  const initial = (name.trim()[0] || '·').toUpperCase();

  document.getElementById('userEmail').textContent = email;
  document.getElementById('avatar').textContent = initial;
  document.getElementById('empName').textContent = name;
  document.getElementById('empNameCard').textContent = name;
  document.getElementById('avatarBig').textContent = initial;
  document.getElementById('empEmail').textContent = email;

  document.body.classList.remove('checking');
  document.body.classList.add('ready');

  loadAll();   // 立即載入內容，不等管理員檢查完成
  isAdmin(user.uid).then(ok => {   // 並行檢查，完成後才顯示管理員介面（員工資料選單僅管理員/PIANN 可見）
    if (ok) {
      document.body.classList.add('is-admin');
      document.getElementById('userRole').textContent = '管理員';
      document.getElementById('empRoleCard').textContent = '管理員';
    }
  });
});

/* ---------- 登出 ---------- */
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  window.location.replace('login.html');
});

/* ---------- 今日日期（YYYY年MM月DD日） ---------- */
const _today = new Date();
document.getElementById('todayDate').textContent =
  `${_today.getFullYear()}年${String(_today.getMonth() + 1).padStart(2, '0')}月${String(_today.getDate()).padStart(2, '0')}日`;
</script>
</body>
</html>
