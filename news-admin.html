<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>官網活動消息 — 之間工作室</title><link rel="stylesheet" href="assets/news-admin.css"></head>
<body><header><a href="members.html">← 員工後臺</a><img src="assets/update-20260924/intrvl-logo-horizontal-zh-orange-white.png" alt="之間工作室"><span>官網活動消息</span></header><main>
<p id="auth-status" role="status">正在確認管理員權限…</p><a id="login-link" href="login.html" hidden>登入員工帳號</a>
<section id="editor" hidden><h1>發佈活動與近況</h1><p>發佈後將顯示於官網，請填寫可公開的內容。</p>
<form id="news-form"><label>標題<input id="news-title" required maxlength="150"></label><label>分類<select id="news-category"><option value="event">實體活動</option><option value="shop">販售</option><option value="class">課程</option></select></label><label>活動日期<input id="news-date" type="date" required></label><label>內文<textarea id="news-body" rows="6" maxlength="6000"></textarea></label><label>Instagram 貼文網址（選填）<input id="news-url" type="url" maxlength="500" placeholder="https://www.instagram.com/p/…/"></label>
<label>上傳圖片<input id="news-file" type="file" accept="image/jpeg,image/png,image/webp"></label>
<div id="crop-tools" hidden><label>裁切比例<select id="crop-ratio"><option value="1">正方形 1:1</option><option value="0.8">直式 4:5</option><option value="1.7777777778">橫式 16:9</option></select></label><canvas id="crop-preview" width="720" height="720" aria-label="裁切結果預覽"></canvas><div class="sliders"><label>縮放<input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"></label><label>水平位置<input id="crop-x" type="range" min="0" max="1" step="0.01" value="0.5"></label><label>垂直位置<input id="crop-y" type="range" min="0" max="1" step="0.01" value="0.5"></label></div><button type="button" id="remove-image">移除圖片</button></div>
<p id="save-status" role="status" aria-live="polite"></p><div class="actions"><button type="submit" id="publish-news">發佈到官網</button><button type="button" id="reset-news">清空／新增</button></div></form>
<h2>已發佈的消息</h2><p id="list-status" role="status"></p><div id="published-list"></div></section>
</main><script type="module" src="assets/news-admin.js"></script></body></html>
